<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마케팅 활용동의 획득 실적 대시보드 | 한화손해보험</title>
<style>
/* ============================================================
   한화손해보험 · 마케팅 활용동의 획득 실적 대시보드
   ------------------------------------------------------------
   Color  : 한화 오렌지를 유일한 강조색으로. 중성색은 배경 쪽으로
            살짝 푸르게 기울여 선택. 구간 링은 오렌지 명도 램프.
   Type   : 오프라인 실행 전제 → 외부 폰트 없이 시스템 스택.
   Layout : 라벤더 기운 바탕 위 여백 넉넉한 카드 그리드.
   ============================================================ */
:root{
  color-scheme: light;
  --hw:#F37321;  --hw-deep:#BC4C08;  --hw-lite:#FF9F5A;  --hw-pale:#FFC79A;
  --hw-wash:#FFF3EA;
  --ink:#191C27;  --ink-2:#2E3648;
  --slate:#464F69; --slate-l:#626C89;
  --line:#EAECF3; --line-2:#F2F4F8;
  --ground:#F6F7FB; --card:#FFFFFF;
  --up:#12A56A; --down:#E5533C;
  --r:16px; --r-sm:10px;
  --sh:0 1px 2px rgba(25,28,39,.04), 0 10px 26px -12px rgba(25,28,39,.14);
  --sh-lift:0 1px 2px rgba(25,28,39,.05), 0 18px 40px -18px rgba(243,115,33,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  font-family:"Pretendard","Pretendard Variable","Malgun Gothic","맑은 고딕",
    "Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:0 26px 64px}

/* ---------- Header ---------- */
.topbar{background:var(--card);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1320px;margin:0 auto;padding:15px 26px;display:flex;align-items:center;
  gap:15px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--hw-lite),var(--hw));color:#fff;font-weight:800;font-size:16px;
  box-shadow:0 6px 14px -5px rgba(243,115,33,.65)}
.brand-name{font-size:14.5px;font-weight:700;letter-spacing:-.3px}
.brand-sub{font-size:11px;color:var(--slate-l);margin-top:1px}
.topbar h1{font-size:15px;font-weight:600;margin:0;padding-left:15px;color:var(--ink-2);
  border-left:1px solid var(--line);letter-spacing:-.3px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.basis{background:var(--ground);border:1px solid var(--line);border-radius:9px;padding:8px 14px;
  font-size:12.5px;color:var(--slate);white-space:nowrap}
.basis b{color:var(--ink);font-weight:700}
.btn{background:var(--card);border:1px solid var(--line);color:var(--ink-2);border-radius:9px;
  padding:7px 13px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:background .15s,border-color .15s}
.btn:hover{background:var(--ground);border-color:#DDE1EC}
.btn:focus-visible{outline:2px solid var(--hw);outline-offset:2px}
.btn.primary{background:linear-gradient(145deg,var(--hw-lite),var(--hw));border-color:transparent;
  color:#fff;box-shadow:0 6px 14px -6px rgba(243,115,33,.7)}
.btn.primary:hover{filter:brightness(.96)}
.btn.on{background:var(--hw-wash);border-color:var(--hw-pale);color:var(--hw-deep)}

/* ---------- Tabs ---------- */
.tabbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tabbar-in{max-width:1320px;margin:0 auto;padding:9px 26px;display:flex;gap:4px;overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-radius:9px;padding:9px 16px;font:inherit;
  font-size:14px;font-weight:600;color:var(--slate);cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s}
.tab:hover{color:var(--ink);background:var(--ground)}
.tab:focus-visible{outline:2px solid var(--hw);outline-offset:1px}
.tab.on{color:#fff;background:linear-gradient(145deg,var(--hw-lite),var(--hw));
  box-shadow:0 6px 14px -7px rgba(243,115,33,.8)}
.tab.first{margin-right:8px;padding-right:14px;border-right:1px solid var(--line);border-radius:9px 0 0 9px}
.tab.first.on{border-right-color:transparent;border-radius:9px}

/* ---------- Section ---------- */
.sec{margin-top:26px}
.sec-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.sec-hd h2{font-size:17.5px;font-weight:700;margin:0;letter-spacing:-.4px}
.sec-hd .desc{font-size:12.5px;color:var(--slate-l)}
.sec-hd .right{margin-left:auto;font-size:12.5px;color:var(--slate-l)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.card-pad{padding:20px 22px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}

/* ---------- KPI tile ---------- */
.kpi{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh)}
.kpi-l{font-size:12.5px;color:var(--slate);font-weight:600;letter-spacing:.1px}
.kpi-v{font-size:32px;font-weight:700;letter-spacing:-1.3px;margin-top:7px;line-height:1.08;
  font-variant-numeric:tabular-nums}
.kpi-v .u{font-size:14px;font-weight:600;color:var(--slate-l);margin-left:3px;letter-spacing:0}
.kpi-s{font-size:12px;color:var(--slate-l);margin-top:9px}
.kpi.acc .kpi-v{color:var(--hw-deep)}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;
  background:var(--line-2);color:var(--ink-2)}
.chip.up{background:#E7F7F0;color:var(--up)}
.chip.dn{background:#FDECE8;color:var(--down)}
.chip.or{background:var(--hw-wash);color:var(--hw-deep)}

/* ---------- Gauge / ring ---------- */
.gauge-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.gauge-meta{display:flex;flex-direction:column;gap:11px;min-width:150px}
.ring-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ring{display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 8px;
  border-radius:var(--r-sm);background:var(--ground)}
.ring-cap{text-align:center;line-height:1.35}
.ring-cap b{display:block;font-size:12.5px;font-weight:700}
.ring-cap span{font-size:11px;color:var(--slate-l)}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:13px 13px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap;
  font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--slate);font-weight:700;letter-spacing:.2px;background:var(--card);
  border-bottom:1px solid var(--line);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left} th.c,td.c{text-align:center}
tbody tr:nth-child(even){background:#FBFCFE}
tbody tr:hover{background:var(--hw-wash)}
tfoot td{font-weight:700;background:var(--ground);border-top:1px solid var(--line);border-bottom:0}
.tbl-scroll{max-height:520px;overflow:auto;border-radius:0 0 var(--r) var(--r)}
.mute{color:var(--slate);font-weight:400}
.agr{color:var(--hw-deep);font-weight:700}
.rk{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:8px;
  background:var(--line-2);font-size:11px;font-weight:700;color:var(--ink-2)}
.rk.r1{background:linear-gradient(145deg,var(--hw-lite),var(--hw));color:#fff}
.rk.r2{background:var(--hw-pale);color:#7A3A0E}
.rk.r3{background:var(--hw-wash);color:var(--hw-deep)}
.pill{display:inline-block;padding:4px 10px;border-radius:7px;font-size:12.5px;font-weight:600;
  background:var(--line-2);color:var(--ink-2)}
.pill.c1{background:#EDF2FA;color:#33547C}
.pill.c2{background:#F3EEFB;color:#5B4290}
.pill.c3{background:#EAF6EF;color:#256B44}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--hw-wash)}
.bar-cell{width:100%;min-width:70px;height:7px;background:var(--line-2);border-radius:5px;overflow:hidden}
.bar-cell>i{display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--hw-lite),var(--hw))}

/* ---------- misc ---------- */
.inp{border:1px solid var(--line);border-radius:9px;padding:10px 14px;font:inherit;font-size:14px;
  background:var(--ground);color:var(--ink);min-width:260px}
.inp::placeholder{color:var(--slate-l)}
.inp:focus{outline:none;background:var(--card);border-color:var(--hw-pale);
  box-shadow:0 0 0 3px var(--hw-wash)}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.notice{background:var(--hw-wash);border-radius:var(--r-sm);padding:13px 17px;font-size:12.5px;
  color:#8A4211;display:flex;gap:10px;align-items:flex-start}
.notice b{color:#6E340C}
.notice.gray{background:var(--card);color:var(--slate);box-shadow:var(--sh)}
.notice.gray b{color:var(--ink-2)}
.notice.sample{background:#FFF8E8;color:#7A5A12}
.notice.sample b{color:#5C4209}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--slate);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;
  color:var(--slate-l);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.emptybox{padding:44px 20px;text-align:center;color:var(--slate);font-size:14px}
svg{display:block;max-width:100%}
svg .hit{fill:transparent;cursor:pointer}
svg .hit:hover{fill:rgba(243,115,33,.06)}
.card-hd{padding:18px 22px 0;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.card-hd h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px}
.card-hd .sub{font-size:11.5px;color:var(--slate-l)}
.ctitle{font-size:15px;font-weight:700;letter-spacing:-.2px;margin-bottom:16px}
/* 월별 실적 — 페이지에서 가장 크게 읽히는 히어로 차트 */
.hero-chart{padding:22px 24px 10px;
  background:linear-gradient(180deg,#FFFBF7 0%,var(--card) 42%);
  box-shadow:0 1px 2px rgba(25,28,39,.05), 0 16px 40px -20px rgba(243,115,33,.30)}
.hero-top{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:6px}
.hero-figs{display:flex;gap:30px;flex-wrap:wrap}
.hero-figs .hf-l{display:block;font-size:12.5px;color:var(--slate);font-weight:600;margin-bottom:3px}
.hero-figs b{font-size:30px;font-weight:700;letter-spacing:-1.1px;line-height:1;
  font-variant-numeric:tabular-nums}
.hero-figs b i{font-size:13px;font-weight:600;color:var(--slate-l);font-style:normal;margin-left:2px}
.hero-figs div:first-child b{color:var(--hw-deep)}
.hero-top .legend{margin-left:auto;padding-bottom:4px}
.stat-row{display:flex;justify-content:space-between;padding:11px 0;
  border-bottom:1px solid var(--line-2);font-size:14px}
.stat-row:last-child{border-bottom:0}
.stat-row .k{color:var(--slate)}
.stat-row .v{font-weight:700;font-variant-numeric:tabular-nums}
.tier{display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:var(--r-sm);
  background:var(--ground);margin-bottom:9px}
.tier .tn{font-size:12px;font-weight:700;color:#fff;border-radius:7px;padding:3px 9px;flex:none;
  background:var(--slate)}
.tier.t1 .tn{background:var(--hw-pale);color:#7A3A0E}
.tier.t2 .tn{background:var(--hw-lite)}
.tier.t3 .tn{background:var(--hw)}
.tier.t0 .tn{background:#C3C9D6}
.tier .tl{font-size:13.5px;color:var(--ink-2)}
.tier .tv{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.tier .tv small{font-size:11px;color:var(--slate-l);font-weight:600;margin-left:3px}
.hint{font-size:12.5px;color:var(--slate-l);margin-top:10px;line-height:1.65}

@media (max-width:1100px){.g-4{grid-template-columns:repeat(2,1fr)}.g-32,.g-3{grid-template-columns:1fr}}
@media (max-width:720px){.g-4,.g-3,.g-2{grid-template-columns:1fr}.wrap{padding:0 15px 44px}
  .topbar-in,.tabbar-in{padding-left:15px;padding-right:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body{background:#fff}.tabbar,.btn,.toolbar{display:none!important}
  .card,.kpi{box-shadow:none;border:1px solid var(--line);break-inside:avoid}
  .hero-chart{background:#fff}
  .tbl-scroll{max-height:none;overflow:visible}.sec{break-inside:avoid}}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CO = ['청주','서울','대구'];
const M = DATA.months, INC = DATA.incentive;
let sampleOn = !!DATA.sampleMode;
const SEP  = () => sampleOn ? DATA.sampleSep : DATA.sep;
const BASE = () => (sampleOn && DATA.sampleSep.baseDate) ? DATA.sampleSep.baseDate : DATA.meta.baseDate;

/* ---- 인센티브 : 구간 도달 시 전건 적용, 1인 월 상한 ---- */
function tierOf(n){ let t=null; for(const x of INC.tiers) if(n>=x.min) t=x; return t; }
function calcInc(n){ const t=tierOf(n); return t ? Math.min(n*t.rate, INC.cap) : 0; }

/* ---- 9월 집계 ---- */
function sepData(){
  const roster = SEP().roster.map(r=>{
    const agr = r[5]||0, join = !!r[4];
    return {center:r[0], team:r[1], id:r[2], name:r[3], join, agr,
            inc: join?calcInc(agr):0, tier: join?tierOf(agr):null};
  });
  const joined = roster.filter(r=>r.join);
  const centers = CO.map(c=>{
    const rows = joined.filter(r=>r.center===c);
    const inc = rows.reduce((a,r)=>a+r.inc,0);
    return {c, n:rows.length, agr:rows.reduce((a,r)=>a+r.agr,0), inc,
            ach:rows.filter(r=>r.inc>0).length, avg: rows.length?inc/rows.length:0};
  }).filter(x=>x.n);
  return {roster, joined, centers,
    agr: joined.reduce((a,r)=>a+r.agr,0),
    inc: joined.reduce((a,r)=>a+r.inc,0),
    ach: joined.filter(r=>r.inc>0).length,
    weeks: SEP().weeks||[]};
}

/* ================================ 차트 ================================ */
function barChart(items, opt={}){
  /* fluid:true → viewBox 비율대로 컨테이너 폭을 꽉 채움 (height:auto)
     이전에는 height 를 px 로 고정해 넓은 카드에서 좌우 여백이 생겼음 */
  const W=opt.w||760, H=opt.h||240;
  const F=opt.fs||1;                                  /* 글자 크기 배율 */
  const PL=Math.round(54*F), PR=opt.line?Math.round(52*F):20, PT=Math.round(20*F), PB=Math.round(44*F);
  const iw=W-PL-PR, ih=H-PT-PB;
  const max=Math.max(1,...items.map(d=>d.v));
  const step = max>2000?500 : max>500?100 : max>100?20 : max>20?5 : 1;
  const nice=Math.max(4, Math.ceil(max/step)*step);   /* 값이 작을 때 눈금 중복 방지 */
  const cw=iw/items.length;
  const bw=Math.min(opt.bw||56, cw*0.52);
  const x=i=>PL+cw*(i+0.5);
  const ihB = opt.line ? ih*0.72 : ih;                /* 동의율 라인과 겹치지 않게 막대는 하단 72% */
  const y=v=>PT+ih-(v/nice)*ihB;
  const style = opt.fluid ? 'width:100%;height:auto' : `width:100%;height:${H}px`;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||'차트')}" style="${style}">
    <defs>
      <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFC08A"/><stop offset="100%" stop-color="#FF9A4D"/></linearGradient>
      <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FF8A33"/><stop offset="100%" stop-color="#E85E10"/></linearGradient>
      <linearGradient id="lnA" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7A85A3" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#7A85A3" stop-opacity="0"/></linearGradient>
    </defs>`;
  /* 컬럼 교차 밴드 — 월 구분을 눈으로 따라가기 쉽게 */
  if(opt.bands) items.forEach((d,i)=>{ if(i%2) s+=`<rect x="${PL+cw*i}" y="${PT-6}" width="${cw}"
      height="${ih+12}" fill="#F7F8FC"/>`; });
  for(let g=0;g<=4;g++){
    const gv=nice/4*g, gy=y(gv);
    s+=`<line x1="${PL}" x2="${W-PR}" y1="${gy}" y2="${gy}" stroke="${g?'#F2F4F8':'#E6E9F0'}"/>`;
    s+=`<text x="${PL-10}" y="${gy+4*F}" text-anchor="end" font-size="${11*F}" fill="#626C89">${nf(gv)}</text>`;
  }
  items.forEach((d,i)=>{
    const bx=x(i)-bw/2, by=y(d.v), bh=Math.max(2,PT+ih-by);
    s+=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="${Math.min(10,bw/2)}"
         fill="${d.hi?'url(#bg2)':(opt.color||'url(#bg1)')}"/>`;
    if(d.v>0){
      const ins = bh >= 34*F;
      s+=`<text x="${x(i)}" y="${ins?by+21*F:by-9*F}" text-anchor="middle" font-size="${13.5*F}"
           font-weight="700" fill="${ins?'#FFFFFF':'#2E3648'}">${nf(d.v)}</text>`;
    }
    if(d.hi && opt.badge){
      const tw=40*F, ty=by-13*F;
      s+=`<g><rect x="${x(i)-tw/2}" y="${ty-13*F}" width="${tw}" height="${17*F}" rx="${8.5*F}" fill="#FFF3EA"/>
        <text x="${x(i)}" y="${ty-0.5*F}" text-anchor="middle" font-size="${10.5*F}" font-weight="700"
        fill="#BC4C08">최고</text></g>`;
    }
    s+=`<text x="${x(i)}" y="${H-(opt.fluid?24*F:13)}" text-anchor="middle" font-size="${13*F}"
         font-weight="${d.hi?700:600}" fill="${d.hi?'#BC4C08':'#2E3648'}">${esc(d.l)}</text>`;
    if(d.l2) s+=`<text x="${x(i)}" y="${H-(opt.fluid?7*F:2)}" text-anchor="middle" font-size="${11*F}"
         fill="#626C89">${esc(d.l2)}</text>`;
  });
  if(opt.line){
    const rs=items.map(d=>d.r||0), hi=Math.max(...rs), lo=Math.min(...rs);
    const span=(hi-lo)||Math.max(hi,.01), bTop=PT+20*F, bBot=PT+ih*0.24;
    const ly=v=>bBot-((v-(lo-span*.35))/(span*1.7||1))*(bBot-bTop);
    const pts=items.map((d,i)=>`${x(i)},${ly(d.r||0)}`).join(' ');
    s+=`<path d="M${PL},${bBot+2} L${pts.split(' ').join(' L')} L${W-PR},${bBot+2} Z" fill="url(#lnA)"/>`;
    s+=`<polyline points="${pts}" fill="none" stroke="#464F69" stroke-width="${2*F}" stroke-dasharray="${5*F} ${4*F}"/>`;
    items.forEach((d,i)=>{
      s+=`<circle cx="${x(i)}" cy="${ly(d.r||0)}" r="${4*F}" fill="#fff" stroke="#464F69" stroke-width="${2*F}"/>`;
      s+=`<text x="${x(i)}" y="${ly(d.r||0)-11*F}" text-anchor="middle" font-size="${11*F}" fill="#464F69"
           font-weight="700" stroke="#fff" stroke-width="${3*F}" paint-order="stroke">${((d.r||0)*100).toFixed(1)}%</text>`;
    });
    s+=`<text x="${W-PR+9}" y="${bBot+4*F}" font-size="${10.5*F}" fill="#626C89">동의율</text>`;
  }
  if(opt.click){                                   /* 막대 영역 클릭 → 해당 월 상세 */
    items.forEach((d,i)=>{
      s+=`<rect class="hit" x="${PL+cw*i}" y="${PT-10}" width="${cw}" height="${ih+PB}" rx="6"
           onclick="${opt.click}(${d.k})"><title>${esc(d.l)} 엑셀 상세 보기</title></rect>`;
    });
  }
  return s+'</svg>';
}

/* 반원 게이지 — 비율 하나를 크게 보여줄 때 */
function gauge(value, total, opt={}){
  const W=232, H=140, C=W/2, CY=118, R=88, SW=17;
  const p = total ? Math.max(0, Math.min(1, value/total)) : 0;
  const pt = (a)=>[C+R*Math.cos(Math.PI*(1-a)), CY-R*Math.sin(Math.PI*(1-a))];
  const arc = (a1,a2,color,w)=>{
    const [x1,y1]=pt(a1), [x2,y2]=pt(a2);
    /* 반원(180°) 안에서만 그리므로 large-arc-flag 는 항상 0 */
    return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}"
            fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
  };
  return `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px;flex:none"
      role="img" aria-label="${esc(opt.aria||'비율')} ${(p*100).toFixed(0)}퍼센트">
    <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB578"/><stop offset="100%" stop-color="#F37321"/></linearGradient></defs>
    ${arc(0,1,'#EEF0F6',SW)}
    ${p>0.004 ? arc(0,p,'url(#gg)',SW) : ''}
    <text x="${C}" y="${CY-26}" text-anchor="middle" font-size="34" font-weight="700"
      fill="#191C27" letter-spacing="-1.5" style="font-variant-numeric:tabular-nums">${(p*100).toFixed(0)}%</text>
    <text x="${C}" y="${CY-6}" text-anchor="middle" font-size="11.5" fill="#626C89">${esc(opt.sub||'')}</text>
  </svg>`;
}

/* 작은 도넛 링 — 구간별 비중 */
function ring(value, total, color, opt={}){
  const S=88, C=S/2, R=34, SW=9;
  const p = total ? Math.max(0,Math.min(1, value/total)) : 0;
  const len = 2*Math.PI*R;
  return `<svg viewBox="0 0 ${S} ${S}" style="width:${S}px;height:${S}px;flex:none"
      role="img" aria-label="${esc(opt.aria||'')} ${(p*100).toFixed(0)}퍼센트">
    <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#EEF0F6" stroke-width="${SW}"/>
    ${p>0.004?`<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${color}" stroke-width="${SW}"
      stroke-linecap="round" stroke-dasharray="${(len*p).toFixed(1)} ${len.toFixed(1)}"
      transform="rotate(-90 ${C} ${C})"/>`:''}
    <text x="${C}" y="${C+2}" text-anchor="middle" font-size="17" font-weight="700" fill="#191C27"
      letter-spacing="-.5" style="font-variant-numeric:tabular-nums">${nf(value)}</text>
    <text x="${C}" y="${C+16}" text-anchor="middle" font-size="9.5" fill="#626C89">${esc(opt.unit||'명')}</text>
  </svg>`;
}

function hBars(items){
  const max=Math.max(1,...items.map(d=>d.v));
  return `<div style="display:flex;flex-direction:column;gap:11px">`+items.map(d=>`
    <div><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">
      <span style="font-weight:600;color:#2E3648">${esc(d.l)}${d.sub?` <span class="mute" style="font-weight:400">${esc(d.sub)}</span>`:''}</span>
      <span style="font-variant-numeric:tabular-nums"><b>${d.fmt||nf(d.v)}</b>${d.r?` <span class="mute">· ${esc(d.r)}</span>`:''}</span>
    </div>
    <div style="height:10px;background:#F2F4F8;border-radius:6px;overflow:hidden">
      <div style="height:100%;width:${(d.v/max*100).toFixed(1)}%;background:${d.c||'#F37321'};border-radius:6px"></div>
    </div></div>`).join('')+'</div>';
}
const kpi=(l,v,u,s,c)=>`<div class="kpi ${c||''}"><div class="kpi-l">${l}</div>
  <div class="kpi-v">${v}${u?`<span class="u">${u}</span>`:''}</div><div class="kpi-s">${s||''}</div></div>`;

    <div class="grid g-32">
      <div class="card">${empty?`<div class="emptybox">9월 참여자 확정 및 실적 입력 후 표시됩니다.</div>`:`<div class="tbl-scroll">
        <table><thead><tr><th class="l">센터</th><th>참여인원</th><th>동의건수</th><th>1인 평균 동의</th>
          <th>달성인원</th><th>인센티브</th><th>1인 평균 금액</th></tr></thead><tbody>
        ${S.centers.length ? S.centers.map(c=>`<tr>
          <td class="l"><span class="pill c${CO.indexOf(c.c)+1}">${esc(c.c)}</span></td>
          <td>${nf(c.n)}</td><td class="agr">${nf(c.agr)}</td><td class="mute">${(c.agr/(c.n||1)).toFixed(1)}건</td>
          <td class="mute">${nf(c.ach)}</td><td><b>${won(c.inc)}</b></td><td class="mute">${won(c.avg)}</td></tr>`).join('')
          : '<tr><td colspan="7" class="emptybox">참여자가 없습니다.</td></tr>'}
        </tbody><tfoot><tr><td class="l">합계</td><td>${nf(S.joined.length)}</td><td class="agr">${nf(S.agr)}</td>
          <td>${(S.agr/(S.joined.length||1)).toFixed(1)}건</td><td>${nf(S.ach)}</td><td>${won(S.inc)}</td>
          <td>${won(S.inc/(S.joined.length||1))}</td></tr></tfoot></table>
      </div>`}</div>
      <div class="card card-pad">
        <div class="ctitle">센터별 동의건수</div>
        ${S.centers.length ? hBars(S.centers.map(c=>({l:c.c+'센터', sub:`${c.n}명`, v:c.agr,
            r:'인센티브 '+won(c.inc), c: c.c==='청주'?'#F37321': c.c==='서울'?'#FF9F5A':'#FFC79A'})))
          : '<div class="emptybox">참여자가 없습니다.</div>'}
        <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line-2)">
          <div class="stat-row"><span class="k">인센티브 총액</span><span class="v">${won(S.inc)}</span></div>
          <div class="stat-row"><span class="k">참여자 1인 평균 금액</span><span class="v">${won(S.inc/(S.joined.length||1))}</span></div>
          <div class="stat-row"><span class="k">달성자 1인 평균 금액</span><span class="v">${won(S.inc/(S.ach||1))}</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ⑤ 상담원 Ranking -->
  <div class="sec">
    <div class="sec-hd"><h2>상담원 Ranking</h2><span class="desc">9월 동의건수 기준 · 인센티브 포함</span>
      <span class="right">${nf(S.joined.length)}명 참여</span></div>
    <div class="card">
      <div class="card-pad" style="padding-bottom:0"><div class="toolbar">
        <input class="inp" id="q1" placeholder="상담사명 · 사번 · 센터 · 팀 검색" oninput="filterRows(this)">
        <span class="mute" id="q1_c" style="font-size:12px"></span></div></div>
      <div class="tbl-scroll">
      <table><thead><tr><th class="c" style="width:44px">순위</th><th class="l">상담사</th><th class="l">센터</th>
        <th class="l">팀</th><th class="c">참여</th><th>동의건수</th><th class="c">구간</th><th>인센티브</th></tr></thead><tbody>
      ${S.roster.slice().sort((a,b)=>b.agr-a.agr).map((r,i)=>`
        <tr data-s="${esc(r.name+' '+r.center+' '+r.team+' '+r.id)}">
          <td class="c"><span class="rk ${i<3&&r.agr>0?'r'+(i+1):''}">${i+1}</span></td>
          <td class="l"><b>${esc(r.name)}</b> <span class="mute" style="font-size:12px">${esc(r.id)}</span></td>
          <td class="l"><span class="pill c${CO.indexOf(r.center)+1}">${esc(r.center)}</span></td>
          <td class="l mute">${esc(r.team)}</td>
          <td class="c">${r.join?'<span class="chip up">참여</span>':'<span class="chip">미참여</span>'}</td>
          <td class="agr">${nf(r.agr)}</td>
          <td class="c">${r.tier?`<span class="chip or">${esc(r.tier.name)}</span>`:'<span class="mute">-</span>'}</td>
          <td>${r.inc?`<b>${won(r.inc)}</b>`:'<span class="mute">0원</span>'}</td></tr>`).join('')}
      </tbody><tfoot><tr><td></td><td class="l">합계</td><td></td><td></td><td class="c">${nf(S.joined.length)}명</td>
        <td class="agr">${nf(S.agr)}</td><td class="c">${nf(S.ach)}명</td><td>${won(S.inc)}</td></tr></tfoot></table>
      </div>
    </div>
  </div>

  <!-- ⑦ 인센티브 기준 -->
  <div class="sec">
    <div class="sec-hd"><h2>인센티브 기준</h2><span class="desc">9월 자율참여부터 적용</span></div>
    <div class="grid g-2" style="align-items:start">
      <div class="card card-pad">
        <div class="ctitle">구간별 달성 인원</div>
        <div class="ring-row">
          ${INC.tiers.map((t,i)=>`<div class="ring">
            ${ring(tiers[i].people, S.joined.length||1, ['#FFC79A','#FF9F5A','#F37321'][i],
                   {unit:'명', aria:esc(t.name)})}
            <div class="ring-cap"><b>${esc(t.name)}</b><span>${nf(t.min)}건 이상 · ${nf(t.rate)}원</span></div>
          </div>`).join('')}
        </div>
        <div style="margin-top:16px">
          ${INC.tiers.map((t,i)=>`<div class="tier t${i+1}"><span class="tn">${esc(t.name)}</span>
            <span class="tl">${nf(tiers[i].people)}명 · 참여자의 ${pct(tiers[i].people, S.joined.length, 0)}</span>
            <span class="tv">${nf(tiers[i].amount)}<small>원</small></span></div>`).join('')}
          <div class="tier t0"><span class="tn">미달성</span>
            <span class="tl">${nf(INC.tiers[0].min)}건 미만 · ${nf(under)}명</span>
            <span class="tv">0<small>원</small></span></div>
        </div>
      </div>
      <div class="card card-pad">
        <div class="ctitle">산정 방식</div>
        <div class="stat-row"><span class="k">적용 방식</span><span class="v">구간 도달 시 전 건수에 단가 적용</span></div>
        <div class="stat-row"><span class="k">1인 월 상한</span><span class="v">${won(INC.cap)}</span></div>
        <div class="stat-row"><span class="k">목표</span><span class="v">없음 (자율참여)</span></div>
        <div class="stat-row"><span class="k">적용 기간</span><span class="v">9월 ~</span></div>
        <div class="hint">예시 · 53건 획득 → 2구간 도달 → 53건 × 700원 = ${won(53*700)}<br>
        예시 · 286건 획득 → 3구간 도달 → 286,000원이나 상한 적용으로 ${won(INC.cap)}</div>
      </div>
    </div>
  </div>

  <div class="notice gray" style="margin-top:18px"><span>ℹ</span><div>
    1~8월은 <b>시도 · 동의건수 관리</b> 기간으로 인센티브가 적용되지 않으며,
    인센티브는 <b>9월 자율참여부터</b> 별도로 산정됩니다.
    1~2월은 시범 운영으로 상담사별 상세가 집계되지 않았습니다.</div>
  </div>`;
}

/* ================================ 월별 엑셀 상세 (1~8월) ================================ */
function viewMonth(mm){
  const m = M.find(x=>x.m===mm);
  const rows = m.agents.map(a=>({center:a[0],team:a[1],id:a[2],name:a[3],att:a[4],agr:a[5]}))
                       .sort((a,b)=> b.agr-a.agr || b.att-a.att);
  const sumAtt = rows.reduce((a,r)=>a+r.att,0), sumAgr = rows.reduce((a,r)=>a+r.agr,0);
  const head = `
  <div class="sec">
    <div class="sec-hd"><h2>${mm}월 실적</h2><span class="desc">엑셀 원본 · 상담사별 시도 / 동의건수</span>
      <span class="right"><button class="tab" style="padding:3px 10px;font-size:12px;border:1px solid var(--line);border-radius:6px"
        onclick="go('main')">← 대시보드</button></span></div>
    <div class="grid g-3">
      ${kpi('시도건수', nf(m.att), '건', '', 'acc2')}
      ${kpi('동의건수', nf(m.agr), '건', '', 'acc')}
      ${kpi('동의율', pct(m.agr,m.att), '', '동의 ÷ 시도', '')}
    </div>
  </div>`;

  if(!rows.length) return head + `<div class="sec"><div class="card"><div class="emptybox">
    ${mm}월은 시범 운영 기간으로 <b>상담사별 상세 데이터가 없습니다.</b><br>
    <span style="font-size:12px">전체 집계(시도 ${nf(m.att)}건 / 동의 ${nf(m.agr)}건)만 보유하고 있습니다.</span>
  </div></div></div>`;

  return head + `
  <div class="sec">
    <div class="sec-hd"><h2>상담사별 상세</h2><span class="desc">${mm}월</span>
      <span class="right">${nf(rows.length)}명</span></div>
    <div class="card">
      <div class="card-pad" style="padding-bottom:0"><div class="toolbar">
        <input class="inp" id="q2" placeholder="상담사명 · 사번 · 센터 · 팀 검색" oninput="filterRows(this)">
        <span class="mute" id="q2_c" style="font-size:12px"></span></div></div>
      <div class="tbl-scroll">
      <table><thead><tr><th class="c" style="width:44px">순위</th><th class="l">센터</th><th class="l">팀</th>
        <th class="l">사번</th><th class="l">상담사명</th><th>시도건수</th><th>동의건수</th><th>동의율</th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr data-s="${esc(r.name+' '+r.center+' '+r.team+' '+r.id)}">
        <td class="c"><span class="rk ${i<3?'r'+(i+1):''}">${i+1}</span></td>
        <td class="l"><span class="pill c${CO.indexOf(r.center)+1}">${esc(r.center)}</span></td>
        <td class="l mute">${esc(r.team)}</td><td class="l mute">${esc(r.id)}</td>
        <td class="l"><b>${esc(r.name)}</b></td>
        <td>${nf(r.att)}</td><td class="agr">${nf(r.agr)}</td><td class="mute">${pct(r.agr,r.att)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td></td><td class="l">합계</td><td></td><td></td><td class="l">${nf(rows.length)}명</td>
        <td>${nf(rows.reduce((a,r)=>a+r.att,0))}</td><td class="agr">${nf(rows.reduce((a,r)=>a+r.agr,0))}</td>
        <td>${pct(rows.reduce((a,r)=>a+r.agr,0), rows.reduce((a,r)=>a+r.att,0))}</td></tr></tfoot></table>
      </div>
    </div>
    ${sumAgr!==m.agr || sumAtt!==m.att ? `<div class="notice gray" style="margin-top:12px"><span>ℹ</span><div>
      원본 엑셀의 월 집계표(시도 ${nf(m.att)} / 동의 ${nf(m.agr)})와 상담사별 합계(시도 ${nf(sumAtt)} / 동의 ${nf(sumAgr)})에
      차이가 있습니다. 상단 카드는 <b>엑셀 월 집계표 기준</b>입니다.</div></div>` : ''}
  </div>`;
}

/* ================================ 검색 / 라우팅 ================================ */
function filterRows(inp){
  const q = inp.value.trim().toLowerCase();
  const tb = inp.closest('.card').querySelector('tbody');
  let n=0;
  tb.querySelectorAll('tr').forEach(tr=>{
    const hit = !q || (tr.dataset.s||'').toLowerCase().includes(q);
    tr.style.display = hit?'':'none'; if(hit) n++;
  });
  const c = document.getElementById(inp.id+'_c');
  if(c) c.textContent = q ? `${n}명 검색됨` : '';
}
function go(v){
  document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('on', b.dataset.v===String(v)));
  $('#view').innerHTML = v==='main' ? viewMain() : viewMonth(Number(v));
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderTabs(){
  $('#tabs').innerHTML = `<button class="tab on first" data-v="main" onclick="go('main')">대시보드</button>` +
    M.map(m=>`<button class="tab" data-v="${m.m}" onclick="go(${m.m})">${m.m}월</button>`).join('');
}

/* ================================ 메일 공유용 요약 ================================ */
function mailSummary(){
  const tot = M.reduce((a,m)=>({att:a.att+m.att, agr:a.agr+m.agr}),{att:0,agr:0});
  const S = sepData();
  const L = [];
  L.push(`[한화손해보험] 마케팅 활용동의 획득 실적 (기준일 ${BASE()})` + (sampleOn ? '  ※ 샘플 데이터' : ''));
  L.push('');
  L.push(`■ 전체 동의 누적 : ${nf(tot.agr)}건 (시도 ${nf(tot.att)}건 / 동의율 ${pct(tot.agr,tot.att)})`);
  L.push('■ 월별 실적 (시도 / 동의 / 동의율)');
  M.forEach(m=> L.push(`  · ${m.m}월 : ${nf(m.att)} / ${nf(m.agr)} / ${pct(m.agr,m.att)}`));
  L.push('');
  L.push(`■ 9월 자율참여 : 참여 ${nf(S.joined.length)}명 / 동의 ${nf(S.agr)}건 / 인센티브 ${won(S.inc)}`);
  if(S.weeks.length){
    L.push('  [주간 실적]');
    S.weeks.forEach(w=> L.push(`  · ${w.label}(${w.range||''}) : 시도 ${nf(w.att||0)} / 동의 ${nf(w.agr||0)}`));
  }
  if(S.centers.length){
    L.push('  [센터별]');
    S.centers.forEach(c=> L.push(`  · ${c.c} : ${nf(c.n)}명 / 동의 ${nf(c.agr)}건 / 인센티브 ${won(c.inc)} / 1인 평균 ${won(c.avg)}`));
  }
  const top = S.roster.filter(r=>r.agr>0).sort((a,b)=>b.agr-a.agr).slice(0,5);
  if(top.length){
    L.push('  [상담원 TOP5]');
    top.forEach((r,i)=> L.push(`  ${i+1}. ${r.name}(${r.center}) ${nf(r.agr)}건 · ${won(r.inc)}`));
  }
  L.push('');
  L.push(`※ 인센티브 : ${INC.tiers.map(t=>`${t.min}건 이상 전건 ${nf(t.rate)}원`).join(' / ')} · 월 상한 ${nf(INC.cap)}원`);
  return L.join('\n');
}
$('#btnCopy').onclick = function(){
  const txt = mailSummary(), b = this;
  const done = ok => { b.textContent = ok?'✓ 복사 완료':'복사 실패'; setTimeout(()=>b.textContent='메일 요약 복사',1800); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta); done(ok);
  };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(()=>done(true), fallback);
  else fallback();
};

/* ================================ 샘플 모드 전환 ================================ */
function paintChrome(){
  $('#basisDate').textContent = BASE();
  $('#btnSample').classList.toggle('on', sampleOn);
  $('#btnSample').textContent = sampleOn ? '샘플 ON' : '샘플';
  $('#btnSample').title = sampleOn ? '실제 데이터 화면으로 전환' : '테스트용 샘플 데이터로 전환';
  $('#footL').innerHTML = `데이터 기준일 <b style="color:#6B7887">${esc(BASE())}</b>` +
    (sampleOn ? ' <span style="color:#B08214;font-weight:700">· 샘플 데이터</span>' : '') +
    ` · 최종 갱신 ${esc(DATA.meta.updatedAt)} · 작성 ${esc(DATA.meta.owner)}`;
}
$('#btnSample').onclick = () => {
  sampleOn = !sampleOn;
  paintChrome();
  go(document.querySelector('#tabs .tab.on')?.dataset.v || 'main');
};

/* ================================ 초기화 ================================ */
paintChrome();
renderTabs();
go('main');
</script>
