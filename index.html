<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마케팅 활용동의 획득 실적 대시보드 | 한화손해보험</title>
<style>
/* ============================================================
   한화손해보험 · 마케팅 활용동의 획득 실적 대시보드
   ------------------------------------------------------------
   Color  : 한화 오렌지를 유일한 강조색으로. 중성색은 배경 쪽으로
            살짝 푸르게 기울여 선택. 구간 링은 오렌지 명도 램프.
   Type   : 오프라인 실행 전제 → 외부 폰트 없이 시스템 스택.
   Layout : 라벤더 기운 바탕 위 여백 넉넉한 카드 그리드.
   ============================================================ */
:root{
  color-scheme: light;
  --hw:#F37321;  --hw-deep:#BC4C08;  --hw-lite:#FF9F5A;  --hw-pale:#FFC79A;
  --hw-wash:#FFF3EA;
  --ink:#191C27;  --ink-2:#2E3648;
  --slate:#464F69; --slate-l:#626C89;
  --line:#EAECF3; --line-2:#F2F4F8;
  --ground:#F6F7FB; --card:#FFFFFF;
  --page:#FAFBFC; --tile:#F2F4F7; --tile-line:#E4E8EF;
  --up:#12A56A; --down:#E5533C;
  --r:16px; --r-sm:10px;
  --sh:0 1px 2px rgba(25,28,39,.04), 0 10px 26px -12px rgba(25,28,39,.14);
  --sh-lift:0 1px 2px rgba(25,28,39,.05), 0 18px 40px -18px rgba(243,115,33,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  /* 나눔고딕 우선. 미설치 PC 에서는 맑은 고딕 등으로 자동 대체 (외부 요청 없음) */
  font-family:"NanumGothic","Nanum Gothic","나눔고딕","NanumBarunGothic",
    "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",
    system-ui,-apple-system,sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:0 26px 64px}

/* ---------- Header ---------- */
.topbar{background:var(--card);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1320px;margin:0 auto;padding:15px 26px;display:flex;align-items:center;
  gap:15px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--hw-lite),var(--hw));color:#fff;font-weight:800;font-size:18px;
  box-shadow:0 6px 14px -5px rgba(243,115,33,.65)}
.brand-name{font-size:15.5px;font-weight:700;letter-spacing:-.3px}
.brand-sub{font-size:12px;color:var(--slate);margin-top:2px}
.topbar h1{font-size:19px;font-weight:700;margin:0;padding-left:17px;color:var(--ink);
  border-left:1px solid var(--line);letter-spacing:-.4px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.basis{background:var(--ground);border:1px solid var(--line);border-radius:9px;padding:8px 14px;
  font-size:12.5px;color:var(--slate);white-space:nowrap}
.basis b{color:var(--ink);font-weight:700}
/* ---------- Tabs ---------- */
.tabbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tabbar-in{max-width:1320px;margin:0 auto;padding:9px 26px;display:flex;gap:4px;overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-radius:9px;padding:9px 16px;font:inherit;
  font-size:14px;font-weight:600;color:var(--slate);cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s}
.tab:hover{color:var(--ink);background:var(--ground)}
.tab:focus-visible{outline:2px solid var(--hw);outline-offset:1px}
.tab.on{color:#fff;background:linear-gradient(145deg,var(--hw-lite),var(--hw));
  box-shadow:0 6px 14px -7px rgba(243,115,33,.8)}
.tab.first{margin-right:8px;padding-right:14px;border-right:1px solid var(--line);border-radius:9px 0 0 9px}
.tab.first.on{border-right-color:transparent;border-radius:9px}

/* ---------- Section ---------- */
.sec{margin-top:26px}
.sec-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.sec-hd h2{font-size:17.5px;font-weight:700;margin:0;letter-spacing:-.4px}
.sec-hd .desc{font-size:12.5px;color:var(--slate-l)}
.sec-hd .right{margin-left:auto;font-size:12.5px;color:var(--slate-l)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.card-pad{padding:20px 22px}
.grid{display:grid;gap:16px}
/* 그리드/플렉스 자식은 기본 min-width:auto 라서 내용(넓은 표)이 칸을 밀어낸다.
   0 으로 낮춰야 표가 자기 영역 안에서 가로 스크롤된다 */
.grid>*{min-width:0}
.card{overflow:hidden}
.tbl-scroll{max-width:100%}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}

/* ---------- KPI tile ---------- */
/* 요약 타일 — 연회색 면에 상단 오렌지 라인(모서리를 따라 곡선으로 흐름) */
.kpi{background:var(--tile);border:1px solid var(--tile-line);border-top:3px solid var(--hw);
  border-radius:var(--r);padding:22px 24px;display:flex;flex-direction:column;justify-content:center}
.kpi-l{font-size:13px;color:var(--slate);font-weight:700;letter-spacing:-.1px}
.kpi-v{font-size:38px;font-weight:800;letter-spacing:-1.8px;margin-top:10px;line-height:1.05;
  font-variant-numeric:tabular-nums}
.kpi-v .u{font-size:16px;font-weight:700;color:var(--slate);margin-left:4px;letter-spacing:0}
.kpi-s{font-size:12.5px;color:var(--slate-l);margin-top:11px}
.kpi.acc{border-top-color:var(--hw)}
.kpi.acc .kpi-v{color:var(--hw-deep)}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;
  background:var(--line-2);color:var(--ink-2)}
.chip.up{background:#E7F7F0;color:var(--up)}
.chip.dn{background:#FDECE8;color:var(--down)}
.chip.or{background:var(--hw-wash);color:var(--hw-deep)}

/* ---------- Gauge / ring ---------- */
.tile-bar{background:var(--tile);border:1px solid var(--tile-line);border-left:5px solid var(--hw);
  border-radius:var(--r);box-shadow:none;display:flex;flex-direction:column}
.tile-bar .gauge-wrap{flex:1;justify-content:center}
.gauge-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
/* 상단 한 줄 배치 : 참여율(넓게) + KPI 2장. 게이지와 수치가 가로로 나란히 놓여 카드 높이가 낮아진다 */
.top-row{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) minmax(0,1fr);align-items:stretch}
@media (max-width:1100px){.top-row{grid-template-columns:1fr 1fr}
  .top-row>:first-child{grid-column:1 / -1}}
@media (max-width:760px){.top-row{grid-template-columns:1fr}
  .top-row>:first-child{grid-column:auto}}
.gauge-meta{display:flex;flex-direction:column;gap:11px;min-width:150px}
.ring-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ring{display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 8px;
  border-radius:var(--r-sm);background:var(--tile);border:1px solid var(--tile-line)}
.ring-cap{text-align:center;line-height:1.35}
.ring-cap b{display:block;font-size:12.5px;font-weight:700}
.ring-cap span{font-size:11px;color:var(--slate-l)}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:13px 13px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap;
  font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--slate);font-weight:700;letter-spacing:.2px;background:var(--card);
  border-bottom:1px solid var(--line);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left} th.c,td.c{text-align:center}
tbody tr:nth-child(even){background:#FBFCFE}
tbody tr:hover{background:var(--hw-wash)}
tfoot td{font-weight:700;background:var(--ground);border-top:1px solid var(--line);border-bottom:0}
.tbl-scroll{max-height:520px;overflow:auto;border-radius:0 0 var(--r) var(--r)}
.mute{color:var(--slate);font-weight:400}
.agr{color:var(--hw-deep);font-weight:700}
.rk{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:8px;
  background:var(--line-2);font-size:11px;font-weight:700;color:var(--ink-2)}
.rk.r1{background:linear-gradient(145deg,var(--hw-lite),var(--hw));color:#fff}
.rk.r2{background:var(--hw-pale);color:#7A3A0E}
.rk.r3{background:var(--hw-wash);color:var(--hw-deep)}
.pill{display:inline-block;padding:4px 10px;border-radius:7px;font-size:12.5px;font-weight:600;
  background:var(--line-2);color:var(--ink-2)}
.pill.c1{background:#EDF2FA;color:#33547C}
.pill.c2{background:#F3EEFB;color:#5B4290}
.pill.c3{background:#EAF6EF;color:#256B44}
.lk{font-size:11.5px;font-weight:700;color:var(--hw-deep);opacity:0;margin-left:5px;
  transition:opacity .12s}
tr.clickable:hover .lk{opacity:1}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--hw-wash)}
.bar-cell{width:100%;min-width:70px;height:8px;background:var(--line-2);overflow:hidden}
.bar-cell>i{display:block;height:100%;background:var(--hw)}

/* ---------- misc ---------- */
.inp{border:1px solid var(--line);border-radius:9px;padding:10px 14px;font:inherit;font-size:14px;
  background:var(--ground);color:var(--ink);min-width:260px}
.inp::placeholder{color:var(--slate-l)}
.inp:focus{outline:none;background:var(--card);border-color:var(--hw-pale);
  box-shadow:0 0 0 3px var(--hw-wash)}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.notice{background:var(--hw-wash);border-radius:var(--r-sm);padding:13px 17px;font-size:12.5px;
  color:#8A4211;display:flex;gap:10px;align-items:flex-start}
.notice b{color:#6E340C}
.notice.gray{background:var(--card);color:var(--slate);box-shadow:var(--sh)}
.notice.gray b{color:var(--ink-2)}
.notice.sample{background:#FFF8E8;color:#7A5A12}
.notice.sample b{color:#5C4209}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--slate);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
/* 주차 데이터 갱신 도구 */
.up-step{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.up-no{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:var(--hw);color:#fff;font-size:12px;font-weight:800}
.up-ta{width:100%;min-height:104px;box-sizing:border-box;padding:11px 13px;font-size:12.5px;
  font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.5;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);resize:vertical}
.up-ta:focus{outline:2px solid var(--hw-pale);border-color:var(--hw)}
.up-act{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.up-btn{padding:8px 18px;font-size:13px;font-weight:700;border:1px solid var(--line);
  border-radius:9px;background:#fff}
.up-btn.primary{background:var(--hw);border-color:var(--hw);color:#fff}
.up-box{margin-top:16px;padding:15px 17px;border-radius:12px;border:1px solid var(--line-2);
  background:var(--ground)}
.up-box.ok{border-color:#BFE3C8;background:#F2FAF4}
.up-box.bad{border-color:#F3C9C0;background:#FDF5F3}
.up-chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;margin-top:7px;line-height:1.5}
.up-chk>span{flex:none;font-weight:800}
.up-chk.y>span{color:#2E7D4F} .up-chk.n>span{color:#C0392B}
.up-weeks{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.up-weeks>div{background:#fff;border:1px solid var(--line-2);border-radius:9px;padding:8px 12px;
  font-size:12.5px;display:flex;gap:8px;align-items:baseline}
.up-weeks i{font-style:normal;font-weight:800;color:var(--hw-deep)}
.up-range{width:104px;padding:4px 8px;font-size:12.5px;border:1px solid var(--line);
  border-radius:7px;background:#fff;color:var(--slate);text-align:center}
.up-file{display:block;width:100%;box-sizing:border-box;padding:16px;border:1.5px dashed var(--hw-pale);
  border-radius:11px;background:var(--hw-wash);font-size:13px;cursor:pointer}
.up-file::file-selector-button{margin-right:12px;padding:7px 15px;font-size:13px;font-weight:700;
  border:0;border-radius:8px;background:var(--hw);color:#fff;cursor:pointer}
.up-file-info{margin-top:9px;font-size:12.5px;color:var(--slate);min-height:1px}
.up-file-info.ok{color:#2E7D4F} .up-file-info.bad{color:#C0392B;font-weight:700}
.up-fold{margin-top:16px;border-top:1px solid var(--line-2);padding-top:12px}
.up-fold summary{cursor:pointer;font-size:12.5px;color:var(--slate);font-weight:700}
.up-fold summary:hover{color:var(--hw-deep)}
.up-link{background:none;border:0;padding:0;font:inherit;color:var(--slate);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px}
.up-link:hover{color:var(--hw-deep)}
.foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;
  color:var(--slate-l);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.nojs{background:var(--tile);border:1px solid var(--tile-line);border-top:3px solid var(--hw);
  border-radius:var(--r);padding:26px 24px;margin-top:24px;font-size:14px;line-height:1.7}
.nojs>b{font-size:16px}
.nojs p{color:var(--slate);margin:10px 0 0}
.nojs-figs{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px;padding-top:18px;
  border-top:1px solid var(--tile-line)}
.nojs-figs span{display:block;font-size:12.5px;color:var(--slate);font-weight:700}
.nojs-figs b{font-size:26px;letter-spacing:-1px}
.nojs-figs div:first-child b{color:var(--hw-deep)}
.nojs-sub{font-size:12px;color:var(--slate-l)!important;margin-top:16px!important}
.emptybox{padding:44px 20px;text-align:center;color:var(--slate);font-size:14px}
svg{display:block;max-width:100%}
svg text{font-family:inherit}
svg .hit{fill:transparent;cursor:pointer}
svg .hit:hover{fill:rgba(243,115,33,.06)}
.card-hd{padding:18px 22px 0;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.card-hd h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px}
.card-hd .sub{font-size:11.5px;color:var(--slate-l)}
.ctitle{font-size:15px;font-weight:700;letter-spacing:-.2px;margin-bottom:16px}
/* 월별 실적 — 페이지에서 가장 크게 읽히는 히어로 차트 */
.hero-chart{padding:22px 24px 10px;
  background:linear-gradient(180deg,#FFFBF7 0%,var(--card) 42%);
  box-shadow:0 1px 2px rgba(25,28,39,.05), 0 16px 40px -20px rgba(243,115,33,.30)}
.hero-top{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:6px}
.hero-figs{display:flex;gap:30px;flex-wrap:wrap}
.hero-figs .hf-l{display:block;font-size:12.5px;color:var(--slate);font-weight:600;margin-bottom:3px}
.hero-figs b{font-size:28px;font-weight:700;letter-spacing:-1.1px;line-height:1;
  font-variant-numeric:tabular-nums}
.hero-figs b i{font-size:13px;font-weight:600;color:var(--slate-l);font-style:normal;margin-left:2px}
.hero-figs div:first-child b{color:var(--hw-deep)}
.hero-top .legend{margin-left:auto;padding-bottom:4px}
.stat-row{display:flex;justify-content:space-between;padding:11px 0;
  border-bottom:1px solid var(--line-2);font-size:14px}
.stat-row:last-child{border-bottom:0}
.stat-row .k{color:var(--slate)}
.stat-row .v{font-weight:700;font-variant-numeric:tabular-nums}
.tier{display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:var(--r-sm);
  background:var(--ground);margin-bottom:9px}
.tier .tn{font-size:12px;font-weight:700;color:#fff;border-radius:7px;padding:3px 9px;flex:none;
  background:var(--slate)}
.tier.t1 .tn{background:var(--hw-pale);color:#7A3A0E}
.tier.t2 .tn{background:var(--hw-lite)}
.tier.t3 .tn{background:var(--hw)}
.tier.t0 .tn{background:#C3C9D6}
.tier .tl{font-size:13.5px;color:var(--ink-2)}
.tier .tv{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.tier .tv small{font-size:11px;color:var(--slate-l);font-weight:600;margin-left:3px}
.hint{font-size:12.5px;color:var(--slate-l);margin-top:10px;line-height:1.65}
.hpoint{margin-top:12px;padding-top:11px;border-top:1px solid var(--line-2);
  font-size:13px;font-weight:700;color:var(--hw-deep)}

@media (max-width:1100px){.g-4{grid-template-columns:repeat(2,1fr)}.g-32,.g-3{grid-template-columns:1fr}}
@media (max-width:720px){
  .g-4,.g-3,.g-2{grid-template-columns:1fr}
  .grid[style*="320px"]{grid-template-columns:1fr!important}
  .wrap{padding:0 14px 40px}
  .topbar-in,.tabbar-in{padding-left:14px;padding-right:14px}
  .topbar h1{padding-left:0;border-left:0;font-size:16.5px;width:100%}
  .topbar-right{margin-left:0;width:100%}
  .hero-top{gap:14px}.hero-figs{gap:20px}.hero-figs b{font-size:24px}
  .hero-top .legend{margin-left:0}
  .hero-chart{padding:18px 14px 8px}
  .card-pad{padding:16px 15px}
  .kpi{padding:18px 17px}.kpi-v{font-size:30px}
  .ring-row{grid-template-columns:1fr}
  .inp{min-width:0;width:100%}
  .gauge-wrap{justify-content:center}
  table{font-size:13px}th,td{padding:10px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body{background:#fff}.tabbar,.toolbar{display:none!important}
  .card{box-shadow:none;border:1px solid var(--line);break-inside:avoid}
  .kpi{break-inside:avoid}
  .hero-chart{background:#fff}
  .tbl-scroll{max-height:none;overflow:visible}.sec{break-inside:avoid}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-mark">H</div>
      <div><div class="brand-name">한화손해보험</div><div class="brand-sub">고객상담파트</div></div>
    </div>
    <h1>마케팅 활용동의 획득 실적 대시보드</h1>
    <div class="topbar-right">
      <div class="basis">데이터 기준일 <b id="basisDate">-</b></div>
    </div>
  </div>
</header>

<nav class="tabbar"><div class="tabbar-in" id="tabs"></div></nav>

<div class="wrap">
  <noscript>
    <div class="nojs">
      <b>이 페이지를 보려면 자바스크립트가 필요합니다.</b>
      <p>메일 앱의 첨부파일 미리보기에서는 화면이 비어 보일 수 있습니다.
         파일을 <b>내려받아 브라우저(크롬 · 사파리 · 엣지)로 열어주세요.</b></p>
      <div class="nojs-figs">

const $ = s => document.querySelector(s);
const nf = n => (Math.round(n)||0).toLocaleString('ko-KR');
const won = n => nf(n) + '원';
const pct = (a,b,d=1) => b ? (a/b*100).toFixed(d)+'%' : '-';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CO = ['청주','서울','대구'];

let sampleOn = !!DATA.sampleMode;
const SEP  = () => sampleOn ? DATA.sampleSep : DATA.sep;

/* ---- 인센티브 : 구간 도달 시 전건 적용, 1인 월 상한 ---- */
function tierOf(n){ let t=null; for(const x of INC.tiers) if(n>=x.min) t=x; return t; }
function calcInc(n){ const t=tierOf(n); return t ? Math.min(n*t.rate, INC.cap) : 0; }

/* ---- 9월 집계 ---- */

  const roster = SEP().roster.map(r=>{
    const agr = r[5]||0, join = !!r[4];
    return {center:r[0], team:r[1], id:r[2], name:r[3], join, agr,
            inc: join?calcInc(agr):0, tier: join?tierOf(agr):null};
  });
  const joined = roster.filter(r=>r.join);
  const centers = CO.map(c=>{
    const rows = joined.filter(r=>r.center===c);
    const inc = rows.reduce((a,r)=>a+r.inc,0);
    return {c, n:rows.length, agr:rows.reduce((a,r)=>a+r.agr,0), inc,
            ach:rows.filter(r=>r.inc>0).length, avg: rows.length?inc/rows.length:0};
  }).filter(x=>x.n);
  return {roster, joined, centers,
    agr: joined.reduce((a,r)=>a+r.agr,0),
    inc: joined.reduce((a,r)=>a+r.inc,0),
    ach: joined.filter(r=>r.inc>0).length,
    weeks: SEP().weeks||[]};
}

/* ================================ 차트 ================================ */
function barChart(items, opt={}){
  /* fluid:true → viewBox 비율대로 컨테이너 폭을 꽉 채움 (height:auto)
     이전에는 height 를 px 로 고정해 넓은 카드에서 좌우 여백이 생겼음 */
  const W=opt.w||760, H=opt.h||240;
  const F=opt.fs||1;                                  /* 글자 크기 배율 */
  const PL=Math.round(54*F), PR=opt.line?Math.round(52*F):20, PT=Math.round(20*F), PB=Math.round(44*F);
  const iw=W-PL-PR, ih=H-PT-PB;
  const max=Math.max(1,...items.map(d=>d.v));
  const step = max>2000?500 : max>500?100 : max>100?20 : max>20?5 : 1;
  const nice=Math.max(4, Math.ceil(max/step)*step);   /* 값이 작을 때 눈금 중복 방지 */
  const cw=iw/items.length;
  const bw=Math.min(opt.bw||56, cw*0.52);
  const x=i=>PL+cw*(i+0.5);
  const ihB = opt.line ? ih*0.72 : ih;                /* 동의율 라인과 겹치지 않게 막대는 하단 72% */
  const y=v=>PT+ih-(v/nice)*ihB;
  const style = opt.fluid ? 'width:100%;height:auto' : `width:100%;height:${H}px`;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||'차트')}" style="${style}">
    <defs>
      <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFC08A"/><stop offset="100%" stop-color="#FF9A4D"/></linearGradient>
      <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FF8A33"/><stop offset="100%" stop-color="#E85E10"/></linearGradient>
      <linearGradient id="lnA" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7A85A3" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#7A85A3" stop-opacity="0"/></linearGradient>
    </defs>`;
  /* 컬럼 교차 밴드 — 월 구분을 눈으로 따라가기 쉽게 */
  if(opt.bands) items.forEach((d,i)=>{ if(i%2) s+=`<rect x="${PL+cw*i}" y="${PT-6}" width="${cw}"
      height="${ih+12}" fill="#F7F8FC"/>`; });
  for(let g=0;g<=4;g++){
    const gv=nice/4*g, gy=y(gv);
    /* 0 기준선은 진하게, 나머지 눈금선은 옅게 */
    s+=`<line x1="${PL}" x2="${W-PR}" y1="${gy}" y2="${gy}" stroke="${g?'#EDEFF5':'#C9CFDD'}"
         stroke-width="${g?1:1.5}"/>`;
    s+=`<text x="${PL-10}" y="${gy+4*F}" text-anchor="end" font-size="${11*F}" fill="#626C89">${nf(gv)}</text>`;
  }
  items.forEach((d,i)=>{
    const bx=x(i)-bw/2, by=y(d.v), bh=Math.max(2,PT+ih-by);
    /* 기본은 각진 막대. opt.round 지정 시 둥글게 하되 막대 높이의 절반을 넘지 않게 해
       값이 작을 때 알약 모양으로 뭉개지는 것을 막는다 */
    const rx = opt.round ? Math.min(opt.round, bw/2, bh/2) : 0;
    /* 집계 진행 중인 달은 연한 채움 + 점선 테두리로 완료된 달과 구분 */
    s+=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}"${rx?` rx="${rx.toFixed(1)}"`:''}
         fill="${d.partial?'#FFEBD9':(d.hi?'url(#bg2)':(opt.color||'url(#bg1)'))}"
         ${d.partial?'stroke="#F0A05A" stroke-width="1.5" stroke-dasharray="4 3"':''}/>`;
    if(d.v>0){
      const ins = bh >= 34*F && !d.partial;
      s+=`<text x="${x(i)}" y="${ins?by+21*F:by-9*F}" text-anchor="middle" font-size="${13.5*F}"
           font-weight="700" fill="${ins?'#FFFFFF':(d.partial?'#BC4C08':'#2E3648')}">${nf(d.v)}</text>`;
    }
    if(d.partial && opt.badge){
      /* 진행중 막대는 값 라벨이 막대 밖에 찍히므로 뱃지를 그 위로 올린다 */
      const tw=52*F, ty=by-30*F;
      s+=`<g><rect x="${x(i)-tw/2}" y="${ty-13*F}" width="${tw}" height="${17*F}" rx="${8.5*F}"
           fill="#EDEFF5"/><text x="${x(i)}" y="${ty-0.5*F}" text-anchor="middle"
           font-size="${10.5*F}" font-weight="700" fill="#464F69">집계중</text></g>`;
    }
    if(d.hi && opt.badge){
      const tw=40*F, ty=by-13*F;
      s+=`<g><rect x="${x(i)-tw/2}" y="${ty-13*F}" width="${tw}" height="${17*F}" rx="${8.5*F}" fill="#FFF3EA"/>
        <text x="${x(i)}" y="${ty-0.5*F}" text-anchor="middle" font-size="${10.5*F}" font-weight="700"
        fill="#BC4C08">최고</text></g>`;
    }
    s+=`<text x="${x(i)}" y="${H-(opt.fluid?24*F:13)}" text-anchor="middle" font-size="${13*F}"
         font-weight="${d.hi?700:600}" fill="${d.hi?'#BC4C08':'#2E3648'}">${esc(d.l)}</text>`;
    if(d.l2) s+=`<text x="${x(i)}" y="${H-(opt.fluid?7*F:2)}" text-anchor="middle" font-size="${11*F}"
         fill="#626C89">${esc(d.l2)}</text>`;
  });
  /* 동의율은 값이 있는 항목만 그린다. 9월부터는 시도건수를 추출하지 않아
     동의율이 없으므로, 0% 로 찍히지 않도록 해당 항목을 선에서 제외한다 */
  const pl = opt.line ? items.map((d,i)=>({i, r:d.r})).filter(p=>typeof p.r==='number') : [];
  if(pl.length){
    const rs=pl.map(p=>p.r), hi=Math.max(...rs), lo=Math.min(...rs);
    const span=(hi-lo)||Math.max(hi,.01), bTop=PT+20*F, bBot=PT+ih*0.24;
    const ly=v=>bBot-((v-(lo-span*.35))/(span*1.7||1))*(bBot-bTop);
    const pts=pl.map(p=>`${x(p.i)},${ly(p.r)}`).join(' ');
    const xa=x(pl[0].i), xb=x(pl[pl.length-1].i);
    s+=`<path d="M${xa},${bBot+2} L${pts.split(' ').join(' L')} L${xb},${bBot+2} Z" fill="url(#lnA)"/>`;
    s+=`<polyline points="${pts}" fill="none" stroke="#464F69" stroke-width="${2*F}" stroke-dasharray="${5*F} ${4*F}"/>`;
    pl.forEach(p=>{
      s+=`<circle cx="${x(p.i)}" cy="${ly(p.r)}" r="${4*F}" fill="#fff" stroke="#464F69" stroke-width="${2*F}"/>`;
      s+=`<text x="${x(p.i)}" y="${ly(p.r)-11*F}" text-anchor="middle" font-size="${11*F}" fill="#464F69"
           font-weight="700" stroke="#fff" stroke-width="${3*F}" paint-order="stroke">${(p.r*100).toFixed(1)}%</text>`;
    });
    s+=`<text x="${W-PR+9}" y="${bBot+4*F}" font-size="${10.5*F}" fill="#626C89">동의율</text>`;
  }
  if(opt.click){                                   /* 막대 영역 클릭 → 해당 월 상세 */
    items.forEach((d,i)=>{
      if(d.k==null || d.k===undefined) return;
      /* 월 탭은 숫자, 9월은 'sep' 문자열이라 인자를 형태에 맞게 감싼다 */
      const arg = typeof d.k === 'number' ? d.k : `'${d.k}'`;
      s+=`<rect class="hit" x="${PL+cw*i}" y="${PT-10}" width="${cw}" height="${ih+PB}" rx="6"
           onclick="${opt.click}(${arg})"><title>${esc(d.l)} 상세 보기</title></rect>`;
    });
  }
  return s+'</svg>';
}

/* 반원 게이지 — 비율 하나를 크게 보여줄 때 */
function gauge(value, total, opt={}){
  const W=232, H=140, C=W/2, CY=118, R=88, SW=17;
  const p = total ? Math.max(0, Math.min(1, value/total)) : 0;
  const pt = (a)=>[C+R*Math.cos(Math.PI*(1-a)), CY-R*Math.sin(Math.PI*(1-a))];
  const arc = (a1,a2,color,w)=>{
    const [x1,y1]=pt(a1), [x2,y2]=pt(a2);
    /* 반원(180°) 안에서만 그리므로 large-arc-flag 는 항상 0 */
    return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}"
            fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
  };
  return `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px;flex:none"
      role="img" aria-label="${esc(opt.aria||'비율')} ${(p*100).toFixed(0)}퍼센트">
    <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB578"/><stop offset="100%" stop-color="#F37321"/></linearGradient></defs>
    ${arc(0,1,'#E2E6EE',SW)}
    ${p>0.004 ? arc(0,p,'url(#gg)',SW) : ''}
    <text x="${C}" y="${CY-26}" text-anchor="middle" font-size="34" font-weight="700"
      fill="#191C27" letter-spacing="-1.5" style="font-variant-numeric:tabular-nums">${(p*100).toFixed(0)}%</text>
    <text x="${C}" y="${CY-6}" text-anchor="middle" font-size="11.5" fill="#626C89">${esc(opt.sub||'')}</text>
  </svg>`;
}

/* 작은 도넛 링 — 구간별 비중 */
function ring(value, total, color, opt={}){
  const S=88, C=S/2, R=34, SW=9;
  const p = total ? Math.max(0,Math.min(1, value/total)) : 0;
  const len = 2*Math.PI*R;
  return `<svg viewBox="0 0 ${S} ${S}" style="width:${S}px;height:${S}px;flex:none"
      role="img" aria-label="${esc(opt.aria||'')} ${(p*100).toFixed(0)}퍼센트">
    <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#E2E6EE" stroke-width="${SW}"/>
    ${p>0.004?`<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${color}" stroke-width="${SW}"
      stroke-linecap="round" stroke-dasharray="${(len*p).toFixed(1)} ${len.toFixed(1)}"
      transform="rotate(-90 ${C} ${C})"/>`:''}
    <text x="${C}" y="${C+2}" text-anchor="middle" font-size="17" font-weight="700" fill="#191C27"
      letter-spacing="-.5" style="font-variant-numeric:tabular-nums">${nf(value)}</text>
    <text x="${C}" y="${C+16}" text-anchor="middle" font-size="9.5" fill="#626C89">${esc(opt.unit||'명')}</text>
  </svg>`;
}

/* 미니 막대 — 주차별처럼 항목이 몇 개 안 되는 값을 작게 보여줄 때.
   viewBox 를 실제 렌더 폭에 맞추고 max-width 로 상한을 둬 글자가 과하게 커지지 않게 한다 */
function miniBar(items, opt={}){
  const W=opt.w||560, H=opt.h||150, PL=26, PR=26, PT=36, PB=30;
  const iw=W-PL-PR, ih=H-PT-PB;
  const max=Math.max(1,...items.map(d=>d.v));
  const n=items.length, cw=iw/n;
  const bw=Math.min(64, cw*0.5);
  const x=i=>PL+cw*(i+0.5);
  const y=v=>PT+ih-(v/max)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img"
    style="width:100%;max-width:${W}px;height:auto;margin:0 auto"
    aria-label="${esc(opt.aria||'주차별 건수')}">
    <defs><linearGradient id="mbG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB578"/><stop offset="100%" stop-color="#F37321"/>
    </linearGradient></defs>`;
  s+=`<line x1="${PL-6}" x2="${W-PR+6}" y1="${PT+ih}" y2="${PT+ih}" stroke="#C9CFDD" stroke-width="1.5"/>`;
  items.forEach((d,i)=>{
    const bx=x(i)-bw/2, by=y(d.v), bh=Math.max(2,PT+ih-by);
    s+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}"
         height="${bh.toFixed(1)}" fill="url(#mbG)"/>`;
    s+=`<text x="${x(i).toFixed(1)}" y="${(by-11).toFixed(1)}" text-anchor="middle"
         font-size="15" font-weight="700" fill="#BC4C08">${nf(d.v)}</text>`;
    s+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="12"
         fill="#464F69" font-weight="600">${esc(d.l)}</text>`;
  });
  return s+'</svg>';
}

const kpi=(l,v,u,s,c)=>`<div class="kpi ${c||''}"><div class="kpi-l">${l}</div>
  <div class="kpi-v">${v}${u?`<span class="u">${u}</span>`:''}</div><div class="kpi-s">${s||''}</div></div>`;

/* ================================ 메인 대시보드 ================================ */
function viewMain(){
  const tot = M.reduce((a,m)=>({att:a.att+m.att, agr:a.agr+m.agr}),{att:0,agr:0});
  const best = M.reduce((a,b)=> b.agr>a.agr?b:a);
  const S = sepData();
  const wAgr = S.weeks.reduce((a,w)=>a+(w.agr||0),0);
  const empty = S.agr===0 && wAgr===0;
  /* 9월 실적이 들어오면 누계에 포함 (9월은 집계 중이므로 차트·안내에 그 사실을 표기) */
  const hasSep = !empty;
  /* 동의 누계는 9월을 포함 (시도·동의율은 9월부터 추출하지 않아 화면에서 제외) */
  const all = {agr: tot.agr + (hasSep?wAgr:0)};
  const span = hasSep ? `1~${SEP().m}월` : '1~'+M[M.length-1].m+'월';

  /* 구간별 인원 / 금액 */
  const tiers = INC.tiers.map((t,i)=>{
    const nx = INC.tiers[i+1];
    const rows = S.joined.filter(r=> r.agr>=t.min && (!nx || r.agr<nx.min));
    return {...t, people:rows.length, amount:rows.reduce((a,r)=>a+r.inc,0)};
  });
  const under = S.joined.filter(r=>r.agr < INC.tiers[0].min).length;

  /* 월별 차트 : 1~8월(완료) + 9월(집계중). 9월은 실적이 들어온 뒤에만 표시 */
  const chartMonths = M.map(m=>({k:m.m, l:m.m+'월', l2:'시도 '+nf(m.att), v:m.agr,
    r:m.att?m.agr/m.att:0, hi:m.m===best.m}));
  const sepInChart = wAgr>0;
  /* 9월은 동의건수만 집계하므로 l2(시도)·r(동의율) 을 넣지 않는다 */
  if(sepInChart) chartMonths.push({k:'sep', l:SEP().m+'월', v:wAgr, partial:true});

  return `
  ${sampleOn?`<div class="notice sample" style="margin-top:20px"><span>⚑</span><div>
    <b>샘플 데이터 (테스트용)</b> — 지금 보이는 9월 수치는 <b>실제 실적이 아닌 가상 데이터</b>입니다.
    화면 우상단 <b>[샘플]</b> 버튼으로 실제 데이터 화면과 전환할 수 있고,
    파일 상단 <code>sampleMode: false</code> 로 바꾸면 영구히 해제됩니다.</div></div>`
   : empty?`<div class="notice" style="margin-top:20px"><span>✎</span><div>
    <b>9월 실적 입력 대기</b> — 파일 상단 <b>DATA</b> 영역의 <code>sep.weeks</code>(주간 실적)와
    <code>sep.roster</code>(상담사별 동의건수)를 입력하시면 아래 주간 실적 · 인센티브가
    모두 자동 계산됩니다. 현재 참여자 명단 ${nf(S.roster.length)}명이 등록되어 있습니다.</div></div>`:''}

  <!-- ① 전체 동의 누적건수 -->
  <div class="sec">
    <div class="sec-hd"><h2>전체 누적 실적</h2><span class="desc">2026년 1월 ~ ${hasSep?SEP().m:M[M.length-1].m}월${hasSep?' (9월 집계중)':''}</span>
      <span class="right">데이터 기준일 ${esc(BASE())}</span></div>
    <div class="grid top-row">
      <div class="card tile-bar card-pad">
        <div class="ctitle">9월 참여율</div>
        ${empty ? `<div class="gauge-wrap">
          ${gauge(0, 1, {sub:'집계 전', aria:'9월 자율참여율'})}
          <div class="gauge-meta">
            <div><div class="kpi-l">참여 인원</div>
              <div style="font-size:22px;font-weight:700;letter-spacing:-.8px;margin-top:3px;color:var(--slate-l)">
                미정</div></div>
            <div><div class="kpi-l">대상 명단</div>
              <div style="font-size:22px;font-weight:700;letter-spacing:-.8px;margin-top:3px">
                ${nf(S.roster.length)}<span style="font-size:13px;color:var(--slate-l)">명</span></div></div>
          </div>
        </div>
        <div class="hint">자율참여 신청이 확정되면 참여율이 표시됩니다.</div>`
        : `<div class="gauge-wrap">
          ${gauge(S.joined.length, S.roster.length, {sub:'참여', aria:'9월 자율참여율'})}
          <div class="gauge-meta">
            <div><div class="kpi-l">참여 인원</div>
              <div style="font-size:22px;font-weight:700;letter-spacing:-.8px;margin-top:3px">
                ${nf(S.joined.length)}<span style="font-size:13px;color:var(--slate-l)"> / ${nf(S.roster.length)}명</span></div></div>
            <div><div class="kpi-l">인센티브 현황</div>
              <div style="font-size:22px;font-weight:700;letter-spacing:-.8px;margin-top:3px;color:var(--hw-deep)">
                ${nf(S.ach)}<span style="font-size:13px;color:var(--slate-l)">명</span></div></div>
          </div>
        </div>`}
      </div>
      ${kpi('전체 동의 누적건수', nf(all.agr), '건', `<span class="chip or">최고 ${best.m}월 ${nf(best.agr)}건</span>`, 'acc')}
      ${empty ? kpi('9월 동의 (자율참여)', '—', '', '<span class="chip">데이터 입력 대기</span>', '')
        : kpi('9월 동의 (자율참여)', nf(S.agr), '건',
            `인센티브 <b style="color:var(--hw-deep)">${won(S.inc)}</b>`, 'acc')}
    </div>
  </div>

  <!-- ② 월별 시도건수 · 동의건수 · 동의율 (차트) -->
  <div class="sec">
    <div class="sec-hd"><h2>월별 실적</h2><span class="desc">막대 = 동의건수 · 점선 = 동의율(1~8월) · 하단 = 시도건수(1~8월)</span>
      <span class="right">그래프의 월을 클릭하면 해당 월 엑셀 상세가 열립니다</span></div>
    <div class="card hero-chart">
      <div class="hero-top">
        <div class="hero-figs">
          <div><span class="hf-l">${span} 누적 동의</span><b>${nf(all.agr)}<i>건</i></b></div>
        </div>
        <div class="legend">
          <span><i style="background:linear-gradient(180deg,#FFC08A,#FF9A4D)"></i>월 동의건수</span>
          <span><i style="background:linear-gradient(180deg,#FF8A33,#E85E10)"></i>최고 실적월</span>
          <span><i style="background:#FFEBD9;border:1.5px dashed #F0A05A"></i>집계중</span>
          <span><i style="background:#7A85A3"></i>동의율 (1~8월)</span>
        </div>

/* ================================ 월별 엑셀 상세 (1~8월) ================================ */
function viewMonth(mm){
  const m = M.find(x=>x.m===mm);
  const rows = m.agents.map(a=>({center:a[0],team:a[1],id:a[2],name:a[3],att:a[4],agr:a[5]}))
                       .sort((a,b)=> b.agr-a.agr || b.att-a.att);
  const sumAtt = rows.reduce((a,r)=>a+r.att,0), sumAgr = rows.reduce((a,r)=>a+r.agr,0);
  const head = `
  <div class="sec">
    <div class="sec-hd"><h2>${mm}월 실적</h2><span class="desc">엑셀 원본 · 상담사별 시도 / 동의건수</span>
      <span class="right"><button class="tab" style="padding:3px 10px;font-size:12px;border:1px solid var(--line);border-radius:6px"
        onclick="go('main')">← 대시보드</button></span></div>
    <div class="grid g-3">
      ${kpi('시도건수', nf(m.att), '건', '', 'acc2')}
      ${kpi('동의건수', nf(m.agr), '건', '', 'acc')}
      ${kpi('동의율', pct(m.agr,m.att), '', '동의 ÷ 시도', '')}
    </div>
  </div>`;

  if(!rows.length) return head + `<div class="sec"><div class="card"><div class="emptybox">
    ${mm}월은 시범 운영 기간으로 <b>상담사별 상세 데이터가 없습니다.</b><br>
    <span style="font-size:12px">전체 집계(시도 ${nf(m.att)}건 / 동의 ${nf(m.agr)}건)만 보유하고 있습니다.</span>
  </div></div></div>`;

  return head + `
  <div class="sec">
    <div class="sec-hd"><h2>상담사별 상세</h2><span class="desc">${mm}월</span>
      <span class="right">${nf(rows.length)}명</span></div>
    <div class="card">
      <div class="card-pad" style="padding-bottom:0"><div class="toolbar">
        <input class="inp" id="q2" placeholder="상담사명 · 사번 · 센터 · 팀 검색" oninput="filterRows(this)">
        <span class="mute" id="q2_c" style="font-size:12px"></span></div></div>
      <div class="tbl-scroll">
      <table><thead><tr><th class="c" style="width:44px">구분</th><th class="l">센터</th><th class="l">팀</th>
        <th class="l">사번</th><th class="l">상담사명</th><th>시도건수</th><th>동의건수</th><th>동의율</th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr data-s="${esc(r.name+' '+r.center+' '+r.team+' '+r.id)}">
        <td class="c"><span class="rk ${i<3?'r'+(i+1):''}">${i+1}</span></td>
        <td class="l"><span class="pill c${CO.indexOf(r.center)+1}">${esc(r.center)}</span></td>
        <td class="l mute">${esc(r.team)}</td><td class="l mute">${esc(r.id)}</td>
        <td class="l"><b>${esc(r.name)}</b></td>
        <td>${nf(r.att)}</td><td class="agr">${nf(r.agr)}</td><td class="mute">${pct(r.agr,r.att)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td></td><td class="l">합계</td><td></td><td></td><td class="l">${nf(rows.length)}명</td>
        <td>${nf(rows.reduce((a,r)=>a+r.att,0))}</td><td class="agr">${nf(rows.reduce((a,r)=>a+r.agr,0))}</td>
        <td>${pct(rows.reduce((a,r)=>a+r.agr,0), rows.reduce((a,r)=>a+r.att,0))}</td></tr></tfoot></table>
      </div>
    </div>
    ${sumAgr!==m.agr || sumAtt!==m.att ? `<div class="notice gray" style="margin-top:12px"><span>ℹ</span><div>
      원본 엑셀의 월 집계표(시도 ${nf(m.att)} / 동의 ${nf(m.agr)})와 상담사별 합계(시도 ${nf(sumAtt)} / 동의 ${nf(sumAgr)})에
      차이가 있습니다. 상단 카드는 <b>엑셀 월 집계표 기준</b>입니다.</div></div>` : ''}
  </div>`;
}

        <td class="agr">${nf(w.agr||0)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td class="l">누계</td><td></td>

/* ================================ 동의 리스트 ================================ */
/* 고객 식별정보는 기본 마스킹. DATA.sep.maskPII 로 제어 */
function maskCust(v){ v=String(v||''); return v.length>4 ? '…'+v.slice(-4) : v; }

function viewSepList(empId){
  const ALL = (SEP().list||[]).map(r=>({wk:r[0], date:r[1], id:r[2], name:r[3], cust:r[4]}));
  const L = empId ? ALL.filter(r=>r.id===String(empId)) : ALL;
  const who = empId ? (L[0] || ALL.find(r=>r.id===String(empId))) : null;
  const whoName = who ? who.name
    : (empId ? ((SEP().roster||[]).filter(r=>r[2]===String(empId))[0]||[])[3] || '' : '');
  const mask = SEP().maskPII !== false;

  const head = `
  <div class="sec">
    <div class="sec-hd"><h2>${SEP().m}월 동의 리스트</h2>
      <span class="desc">${empId
        ? `<b style="color:var(--hw-deep)">${esc(whoName)}</b> 상담사 · 사번 ${esc(empId)}`
        : `엑셀 동의List · 기준일 ${esc(BASE())}`}</span>
      <span class="right" style="display:flex;gap:8px">
        ${empId?`<button class="tab" style="padding:4px 12px;font-size:12.5px;
          border:1px solid var(--hw-pale);border-radius:8px;background:var(--hw-wash);
          color:var(--hw-deep)" onclick="go('seplist')">전체 리스트</button>`:''}
        <button class="tab" style="padding:4px 12px;font-size:12.5px;
          border:1px solid var(--line);border-radius:8px" onclick="downloadXlsx()">엑셀 내려받기</button>
        <button class="tab" style="padding:4px 12px;font-size:12.5px;
          border:1px solid var(--line);border-radius:8px" onclick="go('sep')">← ${SEP().m}월 실적</button>
      </span></div>`;

  if(!L.length) return head + `<div class="card"><div class="emptybox">
    ${empId ? `${esc(whoName||empId)} 상담사의 동의 내역이 없습니다.`
            : '동의 리스트가 아직 입력되지 않았습니다.'}</div></div></div>`;

  const byWk = [...new Set(L.map(r=>r.wk))].map(w=>({k:w, n:L.filter(r=>r.wk===w).length}));

  return head + `
    <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)">
      ${kpi(empId?'동의 건수':'총 동의 건수', nf(L.length), '건',
        empId ? `${esc(whoName)} · 전체 ${nf(ALL.length)}건 중 ${pct(L.length,ALL.length,1)}`
              : `상담사 ${nf(new Set(L.map(r=>r.id)).size)}명`, 'acc')}
      <div class="kpi">
        <div class="kpi-l">주차별 동의건수</div>
        <div style="margin-top:6px">
          ${miniBar(byWk.map(w=>({l:w.k, v:w.n})), {aria:'주차별 동의건수'})}
        </div>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-hd"><h2>건별 내역</h2>
      <span class="desc">${nf(L.length)}건 · 최신순</span>
      <span class="right">${mask?'고객 식별정보는 일부만 표시됩니다'
        :'<b style="color:var(--hw-deep)">고객번호 전체 표시 · 대외 공유 금지</b>'}</span></div>
    <div class="card">
      <div class="card-pad" style="padding-bottom:0"><div class="toolbar">
        <input class="inp" id="q4" placeholder="상담사명 · 사번 · 날짜 · 주차 검색" oninput="filterRows(this)">
        <span class="mute" id="q4_c" style="font-size:12.5px"></span></div></div>
      <div class="tbl-scroll">
      <table><thead><tr><th class="c" style="width:54px">NO</th><th class="l">주차</th>
        <th class="l">날짜</th><th class="l">사번</th><th class="l">상담사명</th>
        <th class="l">고객번호</th></tr></thead><tbody>
      ${L.slice().sort((a,b)=> b.date.localeCompare(a.date)).map((r,i)=>`
        <tr data-s="${esc(r.name+' '+r.id+' '+r.date+' '+r.wk)}">

      고객번호는 <b>고객 개인정보</b>이므로 뒤 4자리만 표시합니다.</div></div>`
    :`<div class="notice" style="margin-top:12px"><span>⚠</span><div>

/* ================================ 검색 / 라우팅 ================================ */
function filterRows(inp){
  const q = inp.value.trim().toLowerCase();
  const tb = inp.closest('.card').querySelector('tbody');
  let n=0;
  tb.querySelectorAll('tr').forEach(tr=>{
    const hit = !q || (tr.dataset.s||'').toLowerCase().includes(q);
    tr.style.display = hit?'':'none'; if(hit) n++;

/* ---- 반영된 데이터를 엑셀(.xlsx) 로 내려받기 ----
   ZIP 의 무압축(stored) 방식을 쓰면 압축기 없이도 규격에 맞는 xlsx 를 만들 수 있다.
   문자열은 sharedStrings 대신 inlineStr 로 넣어 부속 파일을 줄였다. */

let CRC_T=null;
function crc32(u8){
  if(!CRC_T){
    CRC_T=new Uint32Array(256);
    for(let i=0;i<256;i++){
      let c=i;
      for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
      CRC_T[i]=c>>>0;
    }
  }
  let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}

function zipStore(files){
  const enc=new TextEncoder(), locals=[], centrals=[];
  let off=0;
  files.forEach(f=>{
    const nb=enc.encode(f.name), data=f.data, crc=crc32(data), sz=data.length;
    const lh=new Uint8Array(30+nb.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true);
    lv.setUint16(8,0,true);                       /* 0 = 무압축 */
    lv.setUint16(10,0,true); lv.setUint16(12,0x2821,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,sz,true); lv.setUint32(22,sz,true);
    lv.setUint16(26,nb.length,true); lv.setUint16(28,0,true);
    lh.set(nb,30);
    locals.push(lh,data);

    const ch=new Uint8Array(46+nb.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0,true); cv.setUint16(10,0,true);
    cv.setUint16(12,0,true); cv.setUint16(14,0x2821,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,sz,true); cv.setUint32(24,sz,true);
    cv.setUint16(28,nb.length,true); cv.setUint16(30,0,true); cv.setUint16(32,0,true);
    cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true);
    cv.setUint32(42,off,true);
    ch.set(nb,46);
    centrals.push(ch);
    off += lh.length + sz;
  });
  const cdSize=centrals.reduce((a,c)=>a+c.length,0);
  const eo=new Uint8Array(22), ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,off,true);
  const all=locals.concat(centrals,[eo]);
  const total=all.reduce((a,c)=>a+c.length,0);
  const out=new Uint8Array(total);
  let p=0; all.forEach(c=>{ out.set(c,p); p+=c.length; });
  return out;
}

const xesc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function colName(i){
  let s='';
  for(i=i+1;i>0;){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=(i-1-r)/26; }
  return s;
}
function sheetXml(rows){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((row,ri)=>{
    x+='<row r="'+(ri+1)+'">';
    row.forEach((v,ci)=>{
      if(v==null || v==='') return;
      const ref=colName(ci)+(ri+1);
      if(typeof v==='number' && isFinite(v)) x+='<c r="'+ref+'"><v>'+v+'</v></c>';
      else x+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xesc(v)+'</t></is></c>';
    });
    x+='</row>';
  });
  return x+'</sheetData></worksheet>';
}

function buildXlsx(sheets){
  const enc=new TextEncoder(), files=[];
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    +'<Default Extension="xml" ContentType="application/xml"/>'
    +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    + sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml"'
      +' ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')
    +'</Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument"'
    +' Target="xl/workbook.xml"/></Relationships>';
  const wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"'
    +' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
    + sheets.map((s,i)=>'<sheet name="'+xesc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')
    +'</sheets></workbook>';
  const wbRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'"'
      +' Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet"'
      +' Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')
    +'</Relationships>';
  files.push({name:'[Content_Types].xml', data:enc.encode(ct)});
  files.push({name:'_rels/.rels',          data:enc.encode(rels)});
  files.push({name:'xl/workbook.xml',      data:enc.encode(wb)});
  files.push({name:'xl/_rels/workbook.xml.rels', data:enc.encode(wbRels)});
  sheets.forEach((s,i)=>files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',
    data:enc.encode(sheetXml(s.rows))}));
  return zipStore(files);
}

/* ============================ 주차 데이터 갱신 도구 ============================
   업무망(인터넷 없음)에서 엑셀 내용을 붙여넣어 주차 실적을 갱신하고,
   갱신된 index.html 을 내려받기 위한 화면. 외부 라이브러리를 쓰지 않는다.
   엑셀에서 범위를 복사하면 클립보드에 탭 구분 텍스트가 들어오는 점을 이용한다. */

const UP = { roster:null, list:null, weeks:null, msg:[], ok:false,
             rows:{roster:null, list:null}, src:'' };
/* ---- xlsx 읽기 : 외부 라이브러리 없이 브라우저 내장 기능만 사용 ----
   xlsx 는 ZIP 안에 XML 이 들어 있는 형식이다.
   압축 해제는 브라우저 내장 DecompressionStream, XML 해석은 DOMParser 를 쓴다.
   DecompressionStream 이 없는 구형 브라우저에서는 붙여넣기 방식으로 안내한다. */

async function inflateRaw(bytes){
  if(typeof DecompressionStream!=='function')
    throw new Error('이 브라우저는 엑셀 파일 열기를 지원하지 않습니다. 아래 ‘직접 붙여넣기’를 이용해 주세요.');
  const ds=new DecompressionStream('deflate-raw');
  const ab=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(ab);
}

async function unzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eo=-1;
  for(let i=u8.length-22; i>=0 && i>=u8.length-65557; i--){
    if(dv.getUint32(i,true)===0x06054b50){ eo=i; break; }
  }
  if(eo<0) throw new Error('엑셀 파일이 아닌 것 같습니다 (.xlsx 파일을 선택해 주세요).');
  const cnt=dv.getUint16(eo+10,true);
  let off=dv.getUint32(eo+16,true);
  const entries={};
  for(let k=0;k<cnt;k++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true);
    const csize =dv.getUint32(off+20,true);
    const nlen=dv.getUint16(off+28,true), elen=dv.getUint16(off+30,true), clen=dv.getUint16(off+32,true);
    const lho =dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(u8.subarray(off+46,off+46+nlen));
    const lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true);
    const start=lho+30+lnlen+lelen;
    entries[name]={method, data:u8.subarray(start,start+csize)};
    off+=46+nlen+elen+clen;
  }
  return {
    has: n=>!!entries[n],
    names: ()=>Object.keys(entries),
    text: async n=>{
      const e=entries[n]; if(!e) return '';
      const raw = e.method===0 ? e.data : await inflateRaw(e.data);
      return new TextDecoder('utf-8').decode(raw);
    }
  };
}

/* 네임스페이스가 붙어도 찾히도록 */
function xEls(node,tag){
  let l=node.getElementsByTagName(tag);
  if(!l || !l.length) l=node.getElementsByTagNameNS('*',tag);
  return l;
}
function xDoc(xml){
  const d=new DOMParser().parseFromString(xml,'application/xml');
  if(d.getElementsByTagName('parsererror').length) throw new Error('엑셀 내부 XML 을 해석하지 못했습니다.');
  return d;
}
function colIdx(ref){
  let n=0;
  for(let i=0;i<ref.length;i++){
    const c=ref.charCodeAt(i);
    if(c>=65&&c<=90) n=n*26+(c-64);
    else if(c>=97&&c<=122) n=n*26+(c-96);
    else break;
  }
  return n-1;
}

function sheetToRows(xml, shared){
  const doc=xDoc(xml), rowEls=xEls(doc,'row'), rows=[];
  for(let i=0;i<rowEls.length;i++){
    const cs=xEls(rowEls[i],'c'), arr=[];
    for(let j=0;j<cs.length;j++){
      const c=cs[j], t=c.getAttribute('t'), r=c.getAttribute('r')||'';
      const idx = r ? colIdx(r) : arr.length;
      let v='';
      if(t==='inlineStr'){
        const ts=xEls(c,'t');
        for(let k=0;k<ts.length;k++) v+=ts[k].textContent;
      }else{
        const ve=xEls(c,'v')[0];
        v = ve ? ve.textContent : '';
        if(t==='s'){ const s=shared[Number(v)]; v = (s==null?'':s); }
      }
      while(arr.length<idx) arr.push('');
      arr[idx]=v;
    }
    rows.push(arr);
  }
  return rows;
}

async function readXlsx(file){
  const zip=await unzip(await file.arrayBuffer());
  if(!zip.has('xl/workbook.xml'))
    throw new Error('엑셀 파일 구조를 찾지 못했습니다. .xls 라면 .xlsx 로 저장한 뒤 올려주세요.');

  /* 공유 문자열 테이블 */
  const shared=[];
  if(zip.has('xl/sharedStrings.xml')){
    const sis=xEls(xDoc(await zip.text('xl/sharedStrings.xml')),'si');
    for(let i=0;i<sis.length;i++){
      const ts=xEls(sis[i],'t'); let s='';
      for(let k=0;k<ts.length;k++) s+=ts[k].textContent;
      shared.push(s);
    }
  }
  /* 시트 이름 ↔ 파일 경로 */
  const rel={};
  if(zip.has('xl/_rels/workbook.xml.rels')){
    const rs=xEls(xDoc(await zip.text('xl/_rels/workbook.xml.rels')),'Relationship');
    for(let i=0;i<rs.length;i++){
      let t=rs[i].getAttribute('Target')||'';
      if(t.indexOf('/')!==0) t='xl/'+t.replace(/^\.\//,'');
      rel[rs[i].getAttribute('Id')]=t.replace(/^\//,'');
    }
  }
  const wb=xDoc(await zip.text('xl/workbook.xml')), shEls=xEls(wb,'sheet'), out=[];
  for(let i=0;i<shEls.length;i++){
    const name=shEls[i].getAttribute('name')||('시트'+(i+1));
    let path=null;
    for(const a of ['r:id','id','relationshipId']){
      const v=shEls[i].getAttribute(a); if(v && rel[v]){ path=rel[v]; break; }
    }
    if(!path) path='xl/worksheets/sheet'+(i+1)+'.xml';
    if(!zip.has(path)) continue;
    out.push({name, rows: sheetToRows(await zip.text(path), shared)});
  }
  if(!out.length) throw new Error('읽을 수 있는 시트가 없습니다.');
  return out;
}

function tsvRows(text){
  return String(text||'').replace(/\r/g,'').split('\n')
    .map(l=>l.split('\t')).filter(r=>r.some(c=>String(c).trim()!==''));
}
const nz   = v => String(v==null?'':v).trim();
const dig  = v => nz(v).replace(/[^0-9]/g,'');
const p2   = n => ('0'+n).slice(-2);
const YEAR = () => (DATA.meta.baseDate||'').slice(0,4) || String(new Date().getFullYear());

/* 시트를 통째로 붙여넣어도 되도록 머리글 행을 찾아 열 위치를 잡는다 */
function findCols(rows, spec){
  for(let i=0;i<Math.min(rows.length,40);i++){
    const cells = rows[i].map(c=>nz(c).replace(/\s/g,''));
    const map={}; let ok=true;
    for(const key in spec){
      let idx=-1;
      for(const n of spec[key]){
        idx = cells.findIndex(c=>c && c.indexOf(n)>=0);
        if(idx>=0) break;
      }
      if(idx<0){ ok=false; break; }
      map[key]=idx;
    }
    if(ok) return {row:i, map};
  }
  return null;
}

/* 엑셀 날짜는 표시 형식이 제각각이라 넉넉히 받아 YYYY-MM-DD 로 통일 */
function ymd(v){
  const s=nz(v); if(!s) return '';
  let m=s.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
  if(m) return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  m=s.match(/^(\d{1,2})[-./](\d{1,2})[-./](\d{4})/);
  if(m) return m[3]+'-'+p2(m[1])+'-'+p2(m[2]);
  m=s.match(/^(\d{1,2})[-./](\d{1,2})$/);
  if(m) return YEAR()+'-'+p2(m[1])+'-'+p2(m[2]);
  const n=Number(s);
  if(isFinite(n) && n>20000 && n<80000){
    try{ return new Date(Date.UTC(1899,11,30)+n*86400000).toISOString().slice(0,10); }catch(e){}
  }
  return s;
}

  name:['상담사명','직원명','성명'],cust:['고객번호']};

function parseRoster(rows){
  const h=findCols(rows,{center:['센터'],team:['팀'],id:['사번'],
    name:['상담사명','직원명','성명'],join:['참여여부','참여'],
    agr:['동의획득건수','동의건수','동의']});
  if(!h) throw new Error('상담사별 실적: 머리글(센터 · 팀 · 사번 · 상담사명 · 참여여부 · 동의건수)을 찾지 못했습니다.');
  const out=[];
  for(let i=h.row+1;i<rows.length;i++){
    const r=rows[i], id=dig(r[h.map.id]), name=nz(r[h.map.name]);
    if(!id || !name) continue;
    const jv=nz(r[h.map.join]);
    out.push([nz(r[h.map.center]), nz(r[h.map.team]), id, name,
      (jv==='참여'||jv==='1'||jv==='O'||jv==='Y') ? 1 : 0,
      parseInt(dig(r[h.map.agr])||'0',10)]);
  }
  if(!out.length) throw new Error('상담사별 실적: 읽어들인 행이 없습니다.');
  return out;
}

function parseList(rows){
  const h=findCols(rows,{wk:['주간','주차'],date:['날짜','일자'],id:['사번'],
    name:['상담사명','직원명','성명'],cust:['고객번호']});
  if(!h) throw new Error('동의 리스트: 머리글(주간 · 날짜 · 사번 · 상담사명 · 고객번호)을 찾지 못했습니다.');
  const out=[];
  for(let i=h.row+1;i<rows.length;i++){
    const r=rows[i], id=dig(r[h.map.id]), wk=nz(r[h.map.wk]);
    if(!id || !wk) continue;
    out.push([wk, ymd(r[h.map.date]), id, nz(r[h.map.name]), dig(r[h.map.cust])]);
  }
  if(!out.length) throw new Error('동의 리스트: 읽어들인 행이 없습니다.');
  return out;
}

/* 주차 실적은 동의 리스트에서 직접 뽑는다. 따로 입력하지 않으므로 서로 어긋날 수 없다 */
function weeksFrom(list){
  const by={}, order=[];
  list.forEach(r=>{ if(!by[r[0]]){ by[r[0]]=[]; order.push(r[0]); } by[r[0]].push(r[1]); });
  order.sort((a,b)=>(parseInt(dig(a)||'0',10)-parseInt(dig(b)||'0',10)) || a.localeCompare(b));
  const md = s => s ? String(Number(s.slice(5,7)))+'/'+s.slice(8,10) : '';
  return order.map(w=>{
    const ds=by[w].filter(Boolean).slice().sort();
    return {label:w, range: ds.length ? md(ds[0])+'~'+md(ds[ds.length-1]) : '', agr:by[w].length};
  });
}

async function upPick(input){
  const file=input.files && input.files[0];
  if(!file) return;
  const info=$('#upFileInfo');
  info.className='up-file-info'; info.textContent='읽는 중…';
  UP.rows={roster:null,list:null}; UP.src='';
  try{
    const sheets=await readXlsx(file);
    /* 시트 이름에 기대지 않고 머리글이 맞는 시트를 고른다 */
    const pick=spec=>{
      for(const sh of sheets) if(findCols(sh.rows,spec)) return sh;
      return null;
    };
    const r=pick(ROSTER_SPEC), l=pick(LIST_SPEC);
    if(!r) throw new Error('‘실적 및 인센티브’에 해당하는 시트를 찾지 못했습니다 (센터 · 팀 · 사번 · 참여여부 · 동의건수).');
    if(!l) throw new Error('‘동의List’에 해당하는 시트를 찾지 못했습니다 (주간 · 날짜 · 사번 · 고객번호).');
    UP.rows={roster:r.rows, list:l.rows};
    UP.src=file.name;
    info.className='up-file-info ok';
    info.innerHTML=`<b>${esc(file.name)}</b> 읽음 · 실적 시트 <b>${esc(r.name)}</b>`
      + ` · 리스트 시트 <b>${esc(l.name)}</b>`;
    upRun();
  }catch(err){
    info.className='up-file-info bad';
    info.textContent=String((err&&err.message)||err);
    $('#upResult').innerHTML='';
  }
}

function upRun(){
  UP.msg=[]; UP.ok=false; UP.roster=UP.list=UP.weeks=null;
  const add=(ok,t)=>UP.msg.push({ok,t});
  try{
    const rRows = UP.rows.roster || tsvRows(($('#upRoster')||{}).value||'');
    const lRows = UP.rows.list   || tsvRows(($('#upList')||{}).value||'');
    if(!rRows.length || !lRows.length)
      throw new Error('엑셀 파일을 선택하거나, 두 시트를 붙여넣어 주세요.');
    UP.roster = parseRoster(rRows);
    UP.list   = parseList(lRows);
    UP.weeks  = weeksFrom(UP.list);

    const rSum = UP.roster.reduce((a,r)=>a+r[5],0);
    const wSum = UP.weeks.reduce((a,w)=>a+w.agr,0);
    add(true, `상담사 ${nf(UP.roster.length)}명 · 참여 ${nf(UP.roster.filter(r=>r[4]).length)}명 읽음`);
    add(true, `동의 리스트 ${nf(UP.list.length)}건 · ${UP.weeks.length}개 주차 읽음`);

    add(rSum===UP.list.length,
      `상담사별 동의합계 ${nf(rSum)}건 vs 리스트 ${nf(UP.list.length)}건 — `
      + (rSum===UP.list.length ? '일치' : '불일치'));
    add(wSum===UP.list.length,
      `주차별 합계 ${nf(wSum)}건 vs 리스트 ${nf(UP.list.length)}건 — `
      + (wSum===UP.list.length ? '일치' : '불일치'));

    /* 상담사 단위까지 맞는지 확인 — 합계만 맞고 사람이 어긋나는 경우를 잡는다 */
    const cnt={}; UP.list.forEach(r=>{ cnt[r[2]]=(cnt[r[2]]||0)+1; });
    const bad=UP.roster.filter(r=>r[5]!==(cnt[r[2]]||0));
    const ghost=Object.keys(cnt).filter(id=>!UP.roster.some(r=>r[2]===id));
    add(!bad.length, bad.length
      ? `상담사별 건수 불일치 ${bad.length}명 (예: ${bad.slice(0,3).map(r=>r[3]+' '+r[5]+'↔'+(cnt[r[2]]||0)).join(', ')})`
      : '상담사별 건수 전원 일치');
    if(ghost.length) add(false, `명단에 없는 사번이 리스트에 있음: ${ghost.slice(0,5).join(', ')}`);

    const ds=UP.list.map(r=>r[1]).filter(Boolean).sort();
    if(ds.length && !$('#upBase').value) $('#upBase').value = ds[ds.length-1];

    UP.ok = UP.msg.every(m=>m.ok) && !ghost.length;
  }catch(err){ add(false, String((err&&err.message)||err)); }
  $('#upResult').innerHTML = upResultHtml();
  /* 검증을 통과하면 즉시 화면 데이터에 반영한다.
     이렇게 해두지 않으면 적용을 누르지 않은 채 [엑셀 내려받기] 를 했을 때
     올린 자료가 아니라 이전 데이터가 나간다. 파일 저장은 여전히 별도 단계. */
  if(UP.ok){ upStage(); paintChrome(); renderTabs(); }
}

function upResultHtml(){
  if(!UP.msg.length) return '';
  const rows=UP.msg.map(m=>`<div class="up-chk ${m.ok?'y':'n'}">
    <span>${m.ok?'✓':'✕'}</span><div>${esc(m.t)}</div></div>`).join('');
  const wk = UP.weeks ? `<div class="hint" style="margin-top:13px">주차 기간은 동의 날짜에서 계산한 값입니다.
      실제 운영 주차와 다르면 아래에서 고칠 수 있습니다.</div>
    <div class="up-weeks">${UP.weeks.map((w,i)=>
      `<div><b>${esc(w.label)}</b>
        <input class="inp up-range" data-i="${i}" value="${esc(w.range)}"
          aria-label="${esc(w.label)} 기간">
        <i>${nf(w.agr)}건</i></div>`).join('')}</div>` : '';
  return `<div class="up-box ${UP.ok?'ok':'bad'}">
    <div class="ctitle">${UP.ok?'검증 통과':'확인이 필요합니다'}</div>
    ${rows}${wk}
    ${UP.ok?`<div class="up-act">
      <button class="tab up-btn" onclick="upApply()">대시보드에서 보기</button>
      <button class="tab up-btn primary" onclick="upSave()">새 index.html 저장</button>
    </div>
    <div class="hint"><b>올린 자료가 화면에 이미 반영됐습니다.</b>
      이 상태에서 [엑셀 내려받기] 를 하면 올린 자료 기준으로 나옵니다.
      다만 <b>파일 자체는 아직 그대로</b>입니다. 다음에 열어도 이 내용이 나오게 하려면
      <b>새 index.html 저장</b> 을 눌러 내려받은 파일로 기존 파일을 바꿔주세요.</div>`
    :`<div class="hint">불일치 항목을 해결한 뒤 다시 확인해 주세요.
      숫자가 맞지 않으면 원본 엑셀에 누락·중복이 있을 수 있습니다.</div>`}
  </div>`;
}

function upStage(){
  if(!UP.ok) return false;
  DATA.meta.baseDate  = $('#upBase').value || DATA.meta.baseDate;
  DATA.meta.updatedAt = new Date().toISOString().slice(0,10);
  document.querySelectorAll('.up-range').forEach(el=>{
    const i=Number(el.dataset.i);
    if(UP.weeks[i]) UP.weeks[i].range = el.value.trim();
  });
  DATA.sep.weeks  = UP.weeks.map(w=>({label:w.label, range:w.range, agr:w.agr}));
  DATA.sep.roster = UP.roster;
  DATA.sep.list   = UP.list;
  return true;
}
function upApply(){
  if(!upStage()) return;
  paintChrome(); renderTabs(); go('main');
}

/* DATA 블록만 새 값으로 바꾼 전체 HTML 을 만들어 내려받는다 */
function upSource(){
  const root = document.documentElement.cloneNode(true);
  const clear = (sel,html) => { const e=root.querySelector(sel); if(e) e.innerHTML=html; };
  clear('#view',''); clear('#tabs',''); clear('#footL','');
  const bd=root.querySelector('#basisDate'); if(bd) bd.textContent='-';
  const sc=[].slice.call(root.querySelectorAll('script'))
    .filter(s=>s.textContent.indexOf('const DATA')>=0)[0];
  if(!sc) throw new Error('DATA 블록을 찾지 못했습니다.');

  const q=JSON.stringify;
  const weeks='\n' + DATA.sep.weeks.map(w=>
    `      { label:${q(w.label)}, range:${q(w.range)}, agr:${w.agr} }`).join(',\n') + '\n    ';
  const roster='\n' + DATA.sep.roster.map(r=>
    `      [${q(r[0])},${q(r[1])},${q(r[2])},${q(r[3])}, ${r[4]}, ${r[5]}]`).join(',\n') + '\n    ';
  const list='\n' + DATA.sep.list.map(r=>
    `      [${q(r[0])},${q(r[1])},${q(r[2])},${q(r[3])},${q(r[4])}]`).join(',\n') + '\n    ';

  let t=sc.textContent;
  const before=t;
  t=t.replace(/baseDate\s*:\s*"[^"]*"/,  'baseDate : '+q(DATA.meta.baseDate));
  t=t.replace(/updatedAt\s*:\s*"[^"]*"/, 'updatedAt: '+q(DATA.meta.updatedAt));
  t=t.replace(/(\n    weeks: \[)[\s\S]*?(\n    \],)/,  '$1'+weeks.replace(/\$/g,'$$$$')+'],');
  t=t.replace(/(\n    roster: \[)[\s\S]*?(\n    \],)/, '$1'+roster.replace(/\$/g,'$$$$')+'],');
  t=t.replace(/(\n    list: \[)[\s\S]*?(\n    \])/,    '$1'+list.replace(/\$/g,'$$$$')+']');
  if(t===before) throw new Error('DATA 블록을 바꾸지 못했습니다.');
  sc.textContent=t;
  /* 문서 선언 문자열을 쪼개 둔 이유 : 게시본 빌드 스크립트가 해당 문자열이 남아 있는지로
     래퍼 태그 제거 여부를 검사하므로, 이 리터럴이 그 검사에 걸리지 않게 하기 위함 */
  return '<!' + 'DOCTYPE html>\n<html lang="ko">\n' + root.innerHTML + '\n</html>\n';
}

function upSave(){
  try{
    if(!upStage()) return;
    const html=upSource();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
    a.download='index.html';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(a.href); },1500);
    paintChrome(); renderTabs();
    $('#upResult').innerHTML = `<div class="up-box ok"><div class="ctitle">저장했습니다</div>
      <div class="up-chk y"><span>✓</span><div>내려받은 <b>index.html</b> 로 기존 파일을 덮어쓰면
        다음부터 이 내용으로 열립니다.</div></div>
      <div class="up-act"><button class="tab up-btn" onclick="downloadXlsx()">반영된 자료 엑셀로 내려받기</button></div>
      </div>`;
  }catch(err){
    $('#upResult').innerHTML = `<div class="up-box bad"><div class="ctitle">저장하지 못했습니다</div>
      <div class="up-chk n"><span>✕</span><div>${esc(String((err&&err.message)||err))}</div></div>
      <div class="hint">브라우저에서 내려받기가 막혀 있으면 저장되지 않습니다.
        파일을 브라우저로 직접 열어(주소가 file:// 로 시작) 다시 시도해 주세요.</div></div>`;
  }
}
