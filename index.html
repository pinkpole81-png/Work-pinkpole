<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마케팅 활용동의 획득 실적 대시보드 | 한화손해보험</title>
<style>
/* ============================================================
   한화손해보험 · 마케팅 활용동의 획득 실적 대시보드
   ============================================================ */
:root{
  --hw:#F37321; --hw-d:#D95E12; --hw-l:#FFF2E9;
  --ink:#16202B; --ink-2:#33414F; --gray:#6B7887; --gray-l:#98A4B0;
  --line:#E3E8ED; --line-2:#EFF2F5; --bg:#F4F6F8; --slate:#4A6076;
  --good:#1F9D63; --bad:#D3453B;
  --shadow:0 1px 2px rgba(22,32,43,.05), 0 4px 14px rgba(22,32,43,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px 56px}

/* Header */
.topbar{background:var(--ink);color:#fff;border-bottom:3px solid var(--hw)}
.topbar-in{max-width:1320px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--hw);display:grid;place-items:center;
  font-weight:800;font-size:15px;color:#fff;flex:none}
.brand-name{font-size:15px;font-weight:700;letter-spacing:-.3px}
.brand-sub{font-size:11px;color:#9DAAB6;margin-top:1px}
.topbar h1{font-size:16px;font-weight:600;margin:0;padding-left:16px;border-left:1px solid #3A4756;color:#E6EAEE;letter-spacing:-.3px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.basis{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:7px;
  padding:6px 12px;font-size:12px;color:#DCE3E9;white-space:nowrap}
.basis b{color:#fff;font-weight:600}
.btn{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#E6EAEE;border-radius:7px;
  padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.primary{background:var(--hw);border-color:var(--hw);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--hw-d)}

/* Tabs */
.tabbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:0 1px 3px rgba(22,32,43,.04)}
.tabbar-in{max-width:1320px;margin:0 auto;padding:0 24px;display:flex;gap:2px;overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:13px 16px;font:inherit;
  font-size:13.5px;font-weight:600;color:var(--gray);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink-2);background:#FAFBFC}
.tab.on{color:var(--hw-d);border-bottom-color:var(--hw)}
.tab.first{padding-right:20px;margin-right:8px;border-right:1px solid var(--line)}

/* Section */
.sec{margin-top:24px}
.sec-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.sec-hd h2{font-size:15px;font-weight:700;margin:0;position:relative;padding-left:11px;letter-spacing:-.3px}
.sec-hd h2::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:2px;background:var(--hw)}
.sec-hd .desc{font-size:12px;color:var(--gray)}
.sec-hd .right{margin-left:auto;font-size:12px;color:var(--gray)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}

/* KPI */
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);
  position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.kpi.acc::after{background:var(--hw)}
.kpi.acc2::after{background:var(--slate)}
.kpi-l{font-size:12px;color:var(--gray);font-weight:500}
.kpi-v{font-size:28px;font-weight:700;letter-spacing:-1px;margin-top:5px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-v .u{font-size:14px;font-weight:600;color:var(--gray);margin-left:2px;letter-spacing:0}
.kpi-s{font-size:11.5px;color:var(--gray-l);margin-top:6px}
.chip{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600;background:var(--line-2);color:var(--ink-2)}
.chip.up{background:#E8F6EF;color:var(--good)}
.chip.dn{background:#FCEBEA;color:var(--bad)}
.chip.or{background:var(--hw-l);color:var(--hw-d)}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:11.5px;color:var(--gray);font-weight:600;background:#FAFBFC;border-bottom:1px solid var(--line);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left} th.c,td.c{text-align:center}
tbody tr:hover{background:#FBFCFD}
tfoot td{font-weight:700;background:#FAFBFC;border-top:1px solid var(--line);border-bottom:0}
.tbl-scroll{max-height:520px;overflow:auto;border-radius:0 0 10px 10px}
.mute{color:var(--gray-l);font-weight:400}
.agr{color:var(--hw-d);font-weight:700}
.rk{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:6px;background:var(--line-2);
  font-size:11px;font-weight:700;color:var(--ink-2)}
.rk.r1{background:var(--hw);color:#fff}
.rk.r2{background:#FBB584;color:#7A3A0E}
.rk.r3{background:var(--hw-l);color:var(--hw-d)}
.pill{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11.5px;font-weight:600;background:var(--line-2);color:var(--ink-2)}
.pill.c1{background:#EAF1F7;color:#2C5578}
.pill.c2{background:#F2EDF7;color:#5A3E7A}
.pill.c3{background:#EDF5EE;color:#2C6B41}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--hw-l)}
.bar-cell{width:100%;min-width:70px;height:6px;background:var(--line-2);border-radius:4px;overflow:hidden}
.bar-cell>i{display:block;height:100%;background:var(--hw);border-radius:4px}

/* misc */
.inp{border:1px solid var(--line);border-radius:7px;padding:7px 11px;font:inherit;font-size:13px;background:#fff;
  color:var(--ink);min-width:260px}
.inp:focus{outline:2px solid var(--hw-l);border-color:var(--hw)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.notice{background:var(--hw-l);border:1px solid #F8D6BC;border-radius:10px;padding:12px 16px;font-size:12.5px;
  color:#8A4211;display:flex;gap:9px;align-items:flex-start}
.notice b{color:#6E340C}
.notice.gray{background:#F7F9FA;border-color:var(--line);color:var(--ink-2)}
.notice.sample{background:#FFF7E6;border-color:#F0D28A;color:#7A5A12}
.notice.sample b{color:#5C4209}
.btn.on{background:#F6C560;border-color:#F6C560;color:#4A3405;font-weight:700}
.notice.gray b{color:var(--ink)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--gray);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--gray-l);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.emptybox{padding:40px 20px;text-align:center;color:var(--gray-l);font-size:13px}
svg{display:block;max-width:100%}
svg .hit{fill:transparent;cursor:pointer}
svg .hit:hover{fill:rgba(243,115,33,.07)}
.card-hd{padding:14px 18px 0;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.card-hd h3{margin:0;font-size:13.5px;font-weight:700}
.card-hd .sub{font-size:11.5px;color:var(--gray)}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.stat-row:last-child{border-bottom:0}
.stat-row .k{color:var(--gray)}
.stat-row .v{font-weight:700;font-variant-numeric:tabular-nums}
.tier{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.tier .tn{font-size:11.5px;font-weight:700;color:#fff;border-radius:5px;padding:2px 8px;flex:none;background:var(--slate)}
.tier.t1 .tn{background:#7A93A8}.tier.t2 .tn{background:#F0A05A}.tier.t3 .tn{background:var(--hw)}
.tier.t0 .tn{background:#B0BAC4}
.tier .tl{font-size:12.5px;color:var(--ink-2)}
.tier .tv{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.tier .tv small{font-size:11px;color:var(--gray);font-weight:500;margin-left:3px}
.hint{font-size:11.5px;color:var(--gray-l);margin-top:8px}

@media (max-width:1100px){.g-4{grid-template-columns:repeat(2,1fr)}.g-32,.g-3{grid-template-columns:1fr}}
@media (max-width:720px){.g-4,.g-3,.g-2{grid-template-columns:1fr}.wrap{padding:0 14px 40px}
  .topbar-in,.tabbar-in{padding-left:14px;padding-right:14px}}
@media print{body{background:#fff}.tabbar,.btn,.toolbar{display:none!important}
  .card,.kpi{box-shadow:none;break-inside:avoid}.tbl-scroll{max-height:none;overflow:visible}.sec{break-inside:avoid}}

const $ = s => document.querySelector(s);
const nf = n => (Math.round(n)||0).toLocaleString('ko-KR');
const won = n => nf(n) + '원';
const pct = (a,b,d=1) => b ? (a/b*100).toFixed(d)+'%' : '-';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CO = ['청주','서울','대구'];
const M = DATA.months, INC = DATA.incentive;
let sampleOn = !!DATA.sampleMode;
const SEP  = () => sampleOn ? DATA.sampleSep : DATA.sep;
const BASE = () => (sampleOn && DATA.sampleSep.baseDate) ? DATA.sampleSep.baseDate : DATA.meta.baseDate;

/* ---- 인센티브 : 구간 도달 시 전건 적용, 1인 월 상한 ---- */
function tierOf(n){ let t=null; for(const x of INC.tiers) if(n>=x.min) t=x; return t; }
function calcInc(n){ const t=tierOf(n); return t ? Math.min(n*t.rate, INC.cap) : 0; }

/* ---- 9월 집계 ---- */
function sepData(){
  const roster = SEP().roster.map(r=>{
    const agr = r[5]||0, join = !!r[4];
    return {center:r[0], team:r[1], id:r[2], name:r[3], join, agr,
            inc: join?calcInc(agr):0, tier: join?tierOf(agr):null};
  });
  const joined = roster.filter(r=>r.join);
  const centers = CO.map(c=>{
    const rows = joined.filter(r=>r.center===c);
    const inc = rows.reduce((a,r)=>a+r.inc,0);
    return {c, n:rows.length, agr:rows.reduce((a,r)=>a+r.agr,0), inc,
            ach:rows.filter(r=>r.inc>0).length, avg: rows.length?inc/rows.length:0};
  }).filter(x=>x.n);
  return {roster, joined, centers,
    agr: joined.reduce((a,r)=>a+r.agr,0),
    inc: joined.reduce((a,r)=>a+r.inc,0),
    ach: joined.filter(r=>r.inc>0).length,
    weeks: SEP().weeks||[]};
}

/* ================================ 차트 ================================ */
function barChart(items, opt={}){
  const W=opt.w||760, H=opt.h||240, PL=48, PR=opt.line?46:16, PT=18, PB=34;
  const iw=W-PL-PR, ih=H-PT-PB;
  const max=Math.max(1,...items.map(d=>d.v));
  const step = max>2000?500 : max>500?100 : max>100?20 : max>20?5 : 1;
  const nice=Math.max(4, Math.ceil(max/step)*step);   /* 값이 작을 때 눈금 중복 방지 */
  const bw=Math.min(48, iw/items.length*0.56);
  const x=i=>PL+iw/items.length*(i+0.5);
  const ihB = opt.line ? ih*0.72 : ih;            /* 동의율 라인과 겹치지 않도록 막대는 하단 72% */
  const y=v=>PT+ih-(v/nice)*ihB;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||'차트')}" style="width:100%;height:${H}px">`;
  for(let g=0;g<=4;g++){
    const gv=nice/4*g, gy=y(gv);
    s+=`<line x1="${PL}" x2="${W-PR}" y1="${gy}" y2="${gy}" stroke="${g?'#EFF2F5':'#DDE3E8'}"/>`;
    s+=`<text x="${PL-8}" y="${gy+4}" text-anchor="end" font-size="10.5" fill="#98A4B0">${nf(gv)}</text>`;
  }
  items.forEach((d,i)=>{
    const bx=x(i)-bw/2, by=y(d.v), bh=Math.max(1,PT+ih-by);
    s+=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="3" fill="${d.hi?'#F37321':(opt.color||'#F0A05A')}"/>`;
    if(d.v>0){
      const ins = bh>=30;
      s+=`<text x="${x(i)}" y="${ins?by+15:by-6}" text-anchor="middle" font-size="11" font-weight="700"
           fill="${ins?'#FFFFFF':'#33414F'}">${nf(d.v)}</text>`;
    }
    s+=`<text x="${x(i)}" y="${H-13}" text-anchor="middle" font-size="11.5" font-weight="${d.hi?700:500}"
         fill="${d.hi?'#D95E12':'#6B7887'}">${esc(d.l)}</text>`;
    if(d.l2) s+=`<text x="${x(i)}" y="${H-2}" text-anchor="middle" font-size="9.5" fill="#B0BAC4">${esc(d.l2)}</text>`;
  });
  if(opt.line){
    const rs=items.map(d=>d.r||0), hi=Math.max(...rs), lo=Math.min(...rs);
    const span=(hi-lo)||Math.max(hi,.01), bTop=PT+18, bBot=PT+ih*0.24;
    const ly=v=>bBot-((v-(lo-span*.35))/(span*1.7||1))*(bBot-bTop);
    s+=`<polyline points="${items.map((d,i)=>`${x(i)},${ly(d.r||0)}`).join(' ')}" fill="none"
         stroke="#4A6076" stroke-width="1.8" stroke-dasharray="4 3"/>`;
    items.forEach((d,i)=>{
      s+=`<circle cx="${x(i)}" cy="${ly(d.r||0)}" r="3" fill="#fff" stroke="#4A6076" stroke-width="1.8"/>`;
      s+=`<text x="${x(i)}" y="${ly(d.r||0)-9}" text-anchor="middle" font-size="9.5" fill="#4A6076" font-weight="600"
           stroke="#fff" stroke-width="2.5" paint-order="stroke">${((d.r||0)*100).toFixed(1)}%</text>`;
    });
    s+=`<text x="${W-PR+8}" y="${bBot+4}" font-size="10" fill="#4A6076">동의율</text>`;
  }
  if(opt.click){                                   /* 막대 영역 클릭 → 해당 월 상세 */
    const cw = iw/items.length;
    items.forEach((d,i)=>{
      s+=`<rect class="hit" x="${PL+cw*i}" y="${PT-10}" width="${cw}" height="${ih+34}" rx="4"
           onclick="${opt.click}(${d.k})"><title>${esc(d.l)} 엑셀 상세 보기</title></rect>`;
    });
  }
  return s+'</svg>';
}
function hBars(items){
  const max=Math.max(1,...items.map(d=>d.v));
  return `<div style="display:flex;flex-direction:column;gap:11px">`+items.map(d=>`
    <div><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">
      <span style="font-weight:600;color:#33414F">${esc(d.l)}${d.sub?` <span class="mute" style="font-weight:400">${esc(d.sub)}</span>`:''}</span>
      <span style="font-variant-numeric:tabular-nums"><b>${d.fmt||nf(d.v)}</b>${d.r?` <span class="mute">· ${esc(d.r)}</span>`:''}</span>
    </div>
    <div style="height:9px;background:#EFF2F5;border-radius:5px;overflow:hidden">
      <div style="height:100%;width:${(d.v/max*100).toFixed(1)}%;background:${d.c||'#F37321'};border-radius:5px"></div>
    </div></div>`).join('')+'</div>';
}
const kpi=(l,v,u,s,c)=>`<div class="kpi ${c||''}"><div class="kpi-l">${l}</div>
  <div class="kpi-v">${v}${u?`<span class="u">${u}</span>`:''}</div><div class="kpi-s">${s||''}</div></div>`;

        <td>${nf(r.att)}</td><td class="agr">${nf(r.agr)}</td><td class="mute">${pct(r.agr,r.att)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td></td><td class="l">합계</td><td></td><td></td><td class="l">${nf(rows.length)}명</td>
        <td>${nf(rows.reduce((a,r)=>a+r.att,0))}</td><td class="agr">${nf(rows.reduce((a,r)=>a+r.agr,0))}</td>
        <td>${pct(rows.reduce((a,r)=>a+r.agr,0), rows.reduce((a,r)=>a+r.att,0))}</td></tr></tfoot></table>
      </div>
    </div>
    ${sumAgr!==m.agr || sumAtt!==m.att ? `<div class="notice gray" style="margin-top:12px"><span>ℹ</span><div>
      원본 엑셀의 월 집계표(시도 ${nf(m.att)} / 동의 ${nf(m.agr)})와 상담사별 합계(시도 ${nf(sumAtt)} / 동의 ${nf(sumAgr)})에
      차이가 있습니다. 상단 카드는 <b>엑셀 월 집계표 기준</b>입니다.</div></div>` : ''}
  </div>`;
}

/* ================================ 검색 / 라우팅 ================================ */
function filterRows(inp){
  const q = inp.value.trim().toLowerCase();
  const tb = inp.closest('.card').querySelector('tbody');
  let n=0;
  tb.querySelectorAll('tr').forEach(tr=>{
    const hit = !q || (tr.dataset.s||'').toLowerCase().includes(q);
    tr.style.display = hit?'':'none'; if(hit) n++;
  });
  const c = document.getElementById(inp.id+'_c');
  if(c) c.textContent = q ? `${n}명 검색됨` : '';
}
function go(v){
  document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('on', b.dataset.v===String(v)));
  $('#view').innerHTML = v==='main' ? viewMain() : viewMonth(Number(v));
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderTabs(){
  $('#tabs').innerHTML = `<button class="tab on first" data-v="main" onclick="go('main')">대시보드</button>` +
    M.map(m=>`<button class="tab" data-v="${m.m}" onclick="go(${m.m})">${m.m}월</button>`).join('');
}

/* ================================ 메일 공유용 요약 ================================ */
function mailSummary(){
  const tot = M.reduce((a,m)=>({att:a.att+m.att, agr:a.agr+m.agr}),{att:0,agr:0});
  const S = sepData();
  const L = [];
  L.push(`[한화손해보험] 마케팅 활용동의 획득 실적 (기준일 ${BASE()})` + (sampleOn ? '  ※ 샘플 데이터' : ''));
  L.push('');
  L.push(`■ 전체 동의 누적 : ${nf(tot.agr)}건 (시도 ${nf(tot.att)}건 / 동의율 ${pct(tot.agr,tot.att)})`);
  L.push('■ 월별 실적 (시도 / 동의 / 동의율)');
  M.forEach(m=> L.push(`  · ${m.m}월 : ${nf(m.att)} / ${nf(m.agr)} / ${pct(m.agr,m.att)}`));
  L.push('');
  L.push(`■ 9월 자율참여 : 참여 ${nf(S.joined.length)}명 / 동의 ${nf(S.agr)}건 / 인센티브 ${won(S.inc)}`);
  if(S.weeks.length){
    L.push('  [주간 실적]');
    S.weeks.forEach(w=> L.push(`  · ${w.label}(${w.range||''}) : 시도 ${nf(w.att||0)} / 동의 ${nf(w.agr||0)}`));
  }
  if(S.centers.length){
    L.push('  [센터별]');
    S.centers.forEach(c=> L.push(`  · ${c.c} : ${nf(c.n)}명 / 동의 ${nf(c.agr)}건 / 인센티브 ${won(c.inc)} / 1인 평균 ${won(c.avg)}`));
  }
  const top = S.roster.filter(r=>r.agr>0).sort((a,b)=>b.agr-a.agr).slice(0,5);
  if(top.length){
    L.push('  [상담원 TOP5]');
    top.forEach((r,i)=> L.push(`  ${i+1}. ${r.name}(${r.center}) ${nf(r.agr)}건 · ${won(r.inc)}`));
  }
  L.push('');
  L.push(`※ 인센티브 : ${INC.tiers.map(t=>`${t.min}건 이상 전건 ${nf(t.rate)}원`).join(' / ')} · 월 상한 ${nf(INC.cap)}원`);
  return L.join('\n');
}
$('#btnCopy').onclick = function(){
  const txt = mailSummary(), b = this;
  const done = ok => { b.textContent = ok?'✓ 복사 완료':'복사 실패'; setTimeout(()=>b.textContent='메일 요약 복사',1800); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta); done(ok);
  };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(()=>done(true), fallback);
  else fallback();
};

/* ================================ 샘플 모드 전환 ================================ */
function paintChrome(){
  $('#basisDate').textContent = BASE();
  $('#btnSample').classList.toggle('on', sampleOn);
  $('#btnSample').textContent = sampleOn ? '샘플 ON' : '샘플';
  $('#btnSample').title = sampleOn ? '실제 데이터 화면으로 전환' : '테스트용 샘플 데이터로 전환';
  $('#footL').innerHTML = `데이터 기준일 <b style="color:#6B7887">${esc(BASE())}</b>` +
    (sampleOn ? ' <span style="color:#B08214;font-weight:700">· 샘플 데이터</span>' : '') +
    ` · 최종 갱신 ${esc(DATA.meta.updatedAt)} · 작성 ${esc(DATA.meta.owner)}`;
}
$('#btnSample').onclick = () => {
  sampleOn = !sampleOn;
  paintChrome();
  go(document.querySelector('#tabs .tab.on')?.dataset.v || 'main');
};

/* ================================ 초기화 ================================ */
paintChrome();
renderTabs();
go('main');
</script>
